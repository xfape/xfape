<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="LEDGER — an animated 100-card flashcard game teaching how banking works, from how interest forms to the CEO scorecard. Available in English, Russian, and Khmer.">
<title>LEDGER — How Banking Works</title>
<style>*{box-sizing:border-box}html,body{margin:0;padding:0}</style>
</head>
<body>
<style>
  :root {
    /* ---- Ledger paper (light) ---- */
    --bg:        #ECEFE8;
    --bg-2:      #E3E7DD;
    --surface:   #FBFAF4;
    --surface-2: #F3F2EA;
    --ink:       #14201C;
    --muted:     #56655C;
    --faint:     #7C8A80;
    --line:      #CDD3C7;
    --line-soft: #DDE1D6;
    --gold:      #9C7526;
    --gold-2:    #B08636;
    --green:     #1F5C48;
    --good:      #2F7D4F;
    --warn:      #A8791F;
    --guilloche: 24, 90, 72;   /* rgb of green ink for engraving */
    --shadow:    0 24px 60px -28px rgba(20,32,28,.45), 0 4px 14px -8px rgba(20,32,28,.25);

    /* Latin faces first; Khmer faces appended so Khmer glyphs fall through per-glyph */
    --f-display: "Hoefler Text","Palatino Linotype",Palatino,"Book Antiqua",Georgia,"Times New Roman","Noto Serif Khmer","Hanuman","Noto Sans Khmer","Khmer OS",serif;
    --f-body:    system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,"Noto Sans Khmer","Khmer OS System","Khmer OS","Battambang",sans-serif;
    --f-mono:    ui-monospace,"SF Mono","Cascadia Code",Menlo,Consolas,"Noto Sans Khmer","Khmer OS",monospace;
    --f-km:      "Noto Sans Khmer","Khmer OS System","Khmer OS","Battambang","Hanuman",system-ui,sans-serif;

    --r:   14px;
    --r-s: 9px;
    color-scheme: light;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg:        #0C1512;
      --bg-2:      #0A1210;
      --surface:   #15201B;
      --surface-2: #1B2721;
      --ink:       #EAEAE0;
      --muted:     #9BAB9F;
      --faint:     #6E7E72;
      --line:      #27342C;
      --line-soft: #1F2B24;
      --gold:      #D8B25A;
      --gold-2:    #E4C578;
      --green:     #4FB088;
      --good:      #58B47C;
      --warn:      #D6A84A;
      --guilloche: 79, 176, 136;
      --shadow:    0 30px 70px -30px rgba(0,0,0,.7), 0 6px 20px -10px rgba(0,0,0,.6);
      color-scheme: dark;
    }
  }
  /* Explicit viewer toggle must win over the media query, both directions */
  :root[data-theme="light"] {
    --bg:#ECEFE8;--bg-2:#E3E7DD;--surface:#FBFAF4;--surface-2:#F3F2EA;--ink:#14201C;
    --muted:#56655C;--faint:#7C8A80;--line:#CDD3C7;--line-soft:#DDE1D6;--gold:#9C7526;
    --gold-2:#B08636;--green:#1F5C48;--good:#2F7D4F;--warn:#A8791F;--guilloche:24,90,72;
    --shadow:0 24px 60px -28px rgba(20,32,28,.45),0 4px 14px -8px rgba(20,32,28,.25);
    color-scheme:light;
  }
  :root[data-theme="dark"] {
    --bg:#0C1512;--bg-2:#0A1210;--surface:#15201B;--surface-2:#1B2721;--ink:#EAEAE0;
    --muted:#9BAB9F;--faint:#6E7E72;--line:#27342C;--line-soft:#1F2B24;--gold:#D8B25A;
    --gold-2:#E4C578;--green:#4FB088;--good:#58B47C;--warn:#D6A84A;--guilloche:79,176,136;
    --shadow:0 30px 70px -30px rgba(0,0,0,.7),0 6px 20px -10px rgba(0,0,0,.6);
    color-scheme:dark;
  }

  * { box-sizing: border-box; }

  #app {
    min-height: 100dvh;
    background:
      radial-gradient(120% 90% at 50% -10%, var(--bg-2) 0%, var(--bg) 60%);
    color: var(--ink);
    font-family: var(--f-body);
    display: flex;
    flex-direction: column;
    padding: clamp(14px, 3vw, 30px);
    gap: clamp(14px, 2.4vw, 22px);
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- Top bar ---------- */
  .topbar {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 18px;
    flex-wrap: wrap;
    border-bottom: 1px solid var(--line);
    padding-bottom: 14px;
  }
  .brand { display: flex; align-items: baseline; gap: 12px; }
  .wordmark {
    font-family: var(--f-mono);
    font-weight: 600;
    letter-spacing: .42em;
    font-size: clamp(15px, 2.6vw, 20px);
    color: var(--ink);
    text-indent: .42em;
  }
  .wordmark b { color: var(--gold-2); font-weight: 600; }
  .tagline {
    font-family: var(--f-display);
    font-style: italic;
    font-size: clamp(12px, 2.2vw, 15px);
    color: var(--muted);
  }
  .tagline .rule { color: var(--faint); font-style: normal; padding: 0 .4em; }

  .stats { display: flex; gap: 20px; align-items: center; }
  .stat { text-align: right; line-height: 1.05; }
  .stat .num {
    font-family: var(--f-mono);
    font-variant-numeric: tabular-nums;
    font-size: clamp(17px, 3vw, 22px);
    color: var(--ink);
    font-weight: 600;
  }
  .stat .num .slash { color: var(--faint); font-weight: 400; }
  .stat .lbl {
    font-family: var(--f-mono);
    font-size: 9.5px;
    text-transform: uppercase;
    letter-spacing: .18em;
    color: var(--faint);
    margin-top: 3px;
  }
  .stat.known .num { color: var(--gold-2); }

  .topbar-right {
    display: flex;
    align-items: center;
    gap: clamp(14px, 3vw, 26px);
    flex-wrap: wrap;
    justify-content: flex-end;
  }

  /* ---------- Language switch ---------- */
  .lang-switch {
    display: inline-flex;
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 3px;
    gap: 2px;
  }
  .lang-switch .lang {
    font-family: var(--f-mono);
    font-size: 12px;
    letter-spacing: .04em;
    color: var(--muted);
    background: transparent;
    border: 0;
    border-radius: 999px;
    padding: 5px 12px;
    cursor: pointer;
    line-height: 1;
    transition: color .18s, background .18s;
  }
  .lang-switch .lang[lang="km"] { font-family: var(--f-km, var(--f-mono)); font-size: 13px; }
  .lang-switch .lang:hover { color: var(--ink); }
  .lang-switch .lang:focus-visible { outline: 2px solid var(--gold-2); outline-offset: 2px; }
  .lang-switch .lang[aria-pressed="true"] {
    color: var(--ink);
    background: var(--surface);
    box-shadow: 0 1px 3px rgba(0,0,0,.14);
  }
  :root[data-theme="dark"] .lang-switch .lang[aria-pressed="true"] { color: var(--gold-2); }

  /* ---------- Filters ---------- */
  .filters {
    display: flex;
    gap: 7px;
    overflow-x: auto;
    padding-bottom: 4px;
    scrollbar-width: thin;
    -ms-overflow-style: none;
    scroll-snap-type: x proximity;
  }
  .filters::-webkit-scrollbar { height: 5px; }
  .filters::-webkit-scrollbar-thumb { background: var(--line); border-radius: 4px; }
  .chip {
    flex: 0 0 auto;
    font-family: var(--f-mono);
    font-size: 11px;
    letter-spacing: .05em;
    text-transform: uppercase;
    color: var(--muted);
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 6px 13px;
    cursor: pointer;
    white-space: nowrap;
    transition: color .18s, background .18s, border-color .18s, transform .12s;
    scroll-snap-align: start;
  }
  .chip:hover { color: var(--ink); border-color: var(--faint); }
  .chip:focus-visible { outline: 2px solid var(--gold-2); outline-offset: 2px; }
  .chip[aria-pressed="true"] {
    color: var(--bg);
    background: var(--green);
    border-color: var(--green);
  }
  :root[data-theme="dark"] .chip[aria-pressed="true"],
  .chip[aria-pressed="true"] { color: #F7FBF3; }
  @media (prefers-color-scheme: dark) {
    .chip[aria-pressed="true"] { color: #06110C; }
  }
  :root[data-theme="dark"] .chip[aria-pressed="true"] { color: #06110C; }
  :root[data-theme="light"] .chip[aria-pressed="true"] { color: #F7FBF3; }
  .chip .c-num {
    color: inherit;
    opacity: .55;
    margin-left: 7px;
    font-variant-numeric: tabular-nums;
  }

  /* ---------- Stage ---------- */
  .stage {
    position: relative;
    flex: 1 1 auto;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 440px;
    perspective: 1800px;
  }
  #guilloche {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    opacity: .5;
  }

  /* ---------- Card ---------- */
  .card {
    position: relative;
    width: min(620px, 100%);
    z-index: 2;
    cursor: pointer;
    animation: enter .5s cubic-bezier(.2,.75,.25,1) both;
  }
  .card:focus-visible { outline: none; }
  .card:focus-visible .face { outline: 2px solid var(--gold-2); outline-offset: 4px; }

  .card-inner {
    display: grid;
    transform-style: preserve-3d;
    transition: transform .62s cubic-bezier(.5,.05,.2,1);
  }
  .card.flipped .card-inner { transform: rotateY(180deg); }

  .face {
    grid-area: 1 / 1;
    -webkit-backface-visibility: hidden;
    backface-visibility: hidden;
    background:
      linear-gradient(158deg, var(--surface) 0%, var(--surface-2) 100%);
    border: 1px solid var(--line);
    border-radius: var(--r);
    box-shadow: var(--shadow);
    padding: clamp(22px, 4vw, 36px);
    display: flex;
    flex-direction: column;
    min-height: 400px;
    overflow: hidden;
  }
  /* engraved inner keyline */
  .face::before {
    content: "";
    position: absolute;
    inset: 9px;
    border: 1px solid var(--line-soft);
    border-radius: calc(var(--r) - 6px);
    pointer-events: none;
  }
  /* gold corner tick, banknote style */
  .face::after {
    content: "";
    position: absolute;
    top: 16px; left: 16px;
    width: 22px; height: 22px;
    border-top: 2px solid var(--gold-2);
    border-left: 2px solid var(--gold-2);
    opacity: .8;
    border-top-left-radius: 5px;
  }
  .back { transform: rotateY(180deg); }

  .face-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    position: relative;
    z-index: 1;
  }
  .serial {
    font-family: var(--f-mono);
    font-variant-numeric: tabular-nums;
    font-size: 12px;
    letter-spacing: .12em;
    color: var(--faint);
  }
  .serial b { color: var(--gold-2); font-weight: 600; }
  .cat-tag {
    font-family: var(--f-mono);
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: .16em;
    color: var(--green);
    border: 1px solid var(--line);
    background: var(--surface-2);
    padding: 4px 9px;
    border-radius: 999px;
  }

  /* Front */
  .front-body {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 16px;
    position: relative;
    z-index: 1;
    text-align: center;
    padding: 10px 4px;
  }
  .kicker {
    font-family: var(--f-mono);
    font-size: 10px;
    letter-spacing: .3em;
    text-transform: uppercase;
    color: var(--faint);
  }
  .concept {
    font-family: var(--f-display);
    font-weight: 500;
    font-size: clamp(26px, 5.4vw, 40px);
    line-height: 1.12;
    letter-spacing: -.01em;
    text-wrap: balance;
    color: var(--ink);
  }
  .concept .big-n {
    display: block;
    font-size: clamp(40px, 9vw, 66px);
    color: var(--gold-2);
    line-height: 1;
    margin-bottom: 6px;
    font-variant-numeric: lining-nums;
  }

  /* Back */
  .back-body {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 16px;
    position: relative;
    z-index: 1;
    padding-top: 20px;
  }
  .back-title {
    font-family: var(--f-display);
    font-size: clamp(19px, 3.6vw, 25px);
    font-weight: 500;
    line-height: 1.2;
    color: var(--ink);
    text-wrap: balance;
  }
  .explain {
    font-size: clamp(14.5px, 2.5vw, 16px);
    line-height: 1.62;
    color: var(--muted);
    max-width: 56ch;
  }
  .lens {
    margin-top: auto;
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-left: 3px solid var(--gold-2);
    border-radius: var(--r-s);
    padding: 13px 16px;
  }
  .lens .lens-lbl {
    font-family: var(--f-mono);
    font-size: 9.5px;
    letter-spacing: .2em;
    text-transform: uppercase;
    color: var(--gold);
    display: flex;
    align-items: center;
    gap: 7px;
    margin-bottom: 6px;
  }
  .lens .lens-lbl::before { content: "◆"; font-size: 8px; }
  .lens p {
    font-family: var(--f-display);
    font-style: italic;
    font-size: clamp(14px, 2.5vw, 16px);
    line-height: 1.45;
    color: var(--ink);
  }

  .flip-hint {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    font-family: var(--f-mono);
    font-size: 10.5px;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--faint);
    position: relative;
    z-index: 1;
  }
  .flip-hint svg { width: 14px; height: 14px; opacity: .8; }
  .known-flag {
    position: absolute;
    top: 14px; right: 16px;
    z-index: 2;
    font-family: var(--f-mono);
    font-size: 9.5px;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--good);
    display: none;
    align-items: center;
    gap: 5px;
  }
  .card.known .known-flag { display: flex; }
  .known-flag::before { content: "✓"; }

  /* ---------- Controls ---------- */
  .controls {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  .progress {
    width: min(620px, 100%);
    height: 4px;
    background: var(--line-soft);
    border-radius: 4px;
    overflow: hidden;
    margin: 0 auto;
  }
  .progress i {
    display: block;
    height: 100%;
    width: 0;
    background: linear-gradient(90deg, var(--green), var(--gold-2));
    border-radius: 4px;
    transition: width .4s cubic-bezier(.4,0,.2,1);
  }
  .btn {
    font-family: var(--f-mono);
    font-size: 12px;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--ink);
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--r-s);
    padding: 10px 15px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    transition: transform .12s, border-color .18s, background .18s, color .18s;
    user-select: none;
  }
  .btn svg { width: 15px; height: 15px; }
  .btn:hover { border-color: var(--faint); transform: translateY(-1px); }
  .btn:active { transform: translateY(0); }
  .btn:focus-visible { outline: 2px solid var(--gold-2); outline-offset: 2px; }
  .btn.primary {
    background: var(--green);
    border-color: var(--green);
    color: #F7FBF3;
    min-width: 130px;
    justify-content: center;
  }
  @media (prefers-color-scheme: dark) { .btn.primary { color: #06110C; } }
  :root[data-theme="dark"] .btn.primary { color: #06110C; }
  :root[data-theme="light"] .btn.primary { color: #F7FBF3; }
  .btn.primary:hover { filter: brightness(1.06); }
  .btn.icon { padding: 10px 12px; }
  .btn.mark[aria-pressed="true"] {
    background: var(--gold-2);
    border-color: var(--gold-2);
    color: #1c1405;
  }
  .btn.mark[aria-pressed="true"] svg { color: #1c1405; }

  .kbd-help {
    text-align: center;
    font-family: var(--f-mono);
    font-size: 10.5px;
    letter-spacing: .06em;
    color: var(--faint);
  }
  .kbd-help kbd {
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 1px 6px;
    font-family: inherit;
    color: var(--muted);
    margin: 0 1px;
  }

  @keyframes enter {
    from { opacity: 0; transform: translateY(14px) scale(.985); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }

  @media (max-width: 560px) {
    .stats { gap: 14px; }
    .face { min-height: 380px; }
    .btn .txt { display: none; }
    .btn.primary .txt { display: inline; }
    .kbd-help { display: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    .card { animation: none; }
    .card-inner { transition: transform .001s; }
    .progress i { transition: none; }
    * { scroll-behavior: auto; }
  }
</style>

<div id="app">
  <header class="topbar">
    <div class="brand">
      <div class="wordmark">LE<b>D</b>GER</div>
      <div class="tagline" id="tagline">How banking works<span class="rule">/</span>100 cards to the C‑suite</div>
    </div>
    <div class="topbar-right">
      <div class="lang-switch" id="lang-switch" role="group" aria-label="Language">
        <button class="lang" data-lang="en" aria-pressed="true" lang="en">EN</button>
        <button class="lang" data-lang="ru" aria-pressed="false" lang="ru">РУ</button>
        <button class="lang" data-lang="km" aria-pressed="false" lang="km">ខ្មែរ</button>
      </div>
      <div class="stats">
        <div class="stat position">
          <div class="num"><span id="pos">1</span><span class="slash"> / </span><span id="deck-total">100</span></div>
          <div class="lbl" id="lbl-card">Card</div>
        </div>
        <div class="stat known">
          <div class="num"><span id="known-count">0</span><span class="slash"> / </span>100</div>
          <div class="lbl" id="lbl-known">Mastered</div>
        </div>
      </div>
    </div>
  </header>

  <nav class="filters" id="filters" aria-label="Filter by module"></nav>

  <section class="stage">
    <canvas id="guilloche" aria-hidden="true"></canvas>

    <div class="card" id="card" tabindex="0" role="button" aria-label="Flashcard. Activate to reveal the answer.">
      <div class="known-flag" aria-hidden="true"><span id="known-flag-txt">Mastered</span></div>
      <div class="card-inner">
        <!-- FRONT -->
        <div class="face front">
          <div class="face-head">
            <span class="serial">№ <b id="f-serial">001</b> · 100</span>
            <span class="cat-tag" id="f-cat">Module</span>
          </div>
          <div class="front-body">
            <div class="kicker" id="f-kicker">Concept</div>
            <div class="concept"><span class="big-n" id="f-bign">01</span><span id="f-concept">…</span></div>
          </div>
          <div class="flip-hint">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/><path d="M3 21v-5h5"/></svg>
            <span id="flip-hint-txt">Reveal the detail</span>
          </div>
        </div>
        <!-- BACK -->
        <div class="face back">
          <div class="face-head">
            <span class="serial">№ <b id="b-serial">001</b> · 100</span>
            <span class="cat-tag" id="b-cat">Module</span>
          </div>
          <div class="back-body">
            <h2 class="back-title" id="b-title">Title</h2>
            <p class="explain" id="b-explain">…</p>
            <div class="lens">
              <div class="lens-lbl" id="lens-lbl">C‑Suite Lens</div>
              <p id="b-lens">…</p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <div class="progress" aria-hidden="true"><i id="progress-bar"></i></div>

  <div class="controls">
    <button class="btn icon" id="prev" aria-label="Previous card" title="Previous (←)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <button class="btn primary" id="flip" aria-label="Flip card">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M3 7h13l-3-3M21 17H8l3 3"/></svg>
      <span class="txt" id="txt-flip">Flip</span>
    </button>
    <button class="btn icon" id="next" aria-label="Next card" title="Next (→)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 18l6-6-6-6"/></svg>
    </button>
    <button class="btn mark" id="mark" aria-pressed="false" aria-label="Mark as mastered" title="Master (K)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 6L9 17l-5-5"/></svg>
      <span class="txt" id="txt-master">Master</span>
    </button>
    <button class="btn" id="shuffle" aria-label="Shuffle deck" title="Shuffle (S)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M16 3h5v5M4 20L21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg>
      <span class="txt" id="txt-shuffle">Shuffle</span>
    </button>

<script>
(function () {
  "use strict";

  /* ===================== CURRICULUM DATA ===================== */
  const CARDS = [
    // ---- Module 1: Interest & Money ----
    ["Interest & Money","How interest forms","Interest is the price of time. A dollar today is worth more than a dollar tomorrow because it can be put to work, and because tomorrow carries risk and inflation. Interest is what a lender charges to give up that time‑value, to be compensated for expected inflation, and to be paid for the chance the money isn't returned.","Every product a bank sells is, at bottom, renting out time and risk."],
    ["Interest & Money","Simple vs compound interest","Simple interest is charged only on the original principal. Compound interest is charged on principal plus all accumulated interest, so it grows exponentially rather than linearly. Over long horizons, compounding dominates — which is why compounding frequency and time matter more than the headline rate.","Small rate or fee differences compound into enormous value across a book's life."],
    ["Interest & Money","Nominal vs real rates","The nominal rate is the stated rate; the real rate strips out inflation (real ≈ nominal − inflation — the Fisher relation). A 6% loan when inflation runs at 5% earns only ~1% of real purchasing power.","Margins that look healthy in nominal terms can be thin — or negative — in real terms."],
    ["Interest & Money","APR vs APY (effective yield)","APR is the simple annualized rate and ignores intra‑year compounding; APY (or EAR) folds compounding in, so it's always ≥ APR. 12% compounded monthly is really ~12.68%. Disclosure rules dictate which one customers must be shown.","How you quote a rate changes the number the customer sees — and what you actually earn."],
    ["Interest & Money","Present value & discounting","Present value converts future cash into today's money by dividing by (1+r)ᵗ — the discount factor. It is the engine behind loan pricing, bond valuation, and every 'what is this future stream worth now?' question.","Discounting is how a bank puts a price on anything that pays out over time."],
    ["Interest & Money","The risk‑free rate","The theoretical return on a zero‑default investment, proxied by short‑term government debt like Treasury bills. It's the floor on which every other rate is built: a risky rate = risk‑free rate + spreads for credit, liquidity, and term.","When the risk‑free rate moves, every asset on the balance sheet reprices."],
    ["Interest & Money","Inflation & purchasing power","Inflation erodes what money can buy over time. Banks feel it twice: it eats the real value of the fixed‑rate loans they hold, and it drives the central‑bank rate decisions that reset their funding costs.","Inflation quietly transfers value between a bank's borrowers and its depositors."],
    ["Interest & Money","Compounding frequency","The more often interest compounds — annually, then monthly, daily, continuously — the higher the effective yield for the same nominal rate. Continuous compounding uses eʳᵗ and underpins derivatives pricing.","Frequency is a lever: it changes real economics without touching the advertised rate."],
    ["Interest & Money","Fixed vs floating rates","A fixed rate is locked for the term; a floating rate resets periodically against a benchmark (SOFR, EURIBOR) plus a margin. Fixed rates push rate risk onto the lender; floating rates push it onto the borrower.","The fixed/floating mix on the book decides who bleeds when rates move."],
    ["Interest & Money","Maturity & the yield curve","The yield curve plots interest rate against maturity. It normally slopes up — longer means more yield for term and inflation risk — while an inverted curve (short above long) has historically warned of recession.","The curve's slope is, in one line, the weather forecast for bank margins."],

    // ---- Module 2: The Bank Model ----
    ["The Bank Model","Borrow short, lend long","Banks take in short‑term, redeemable deposits and turn them into long‑term, illiquid loans, capturing the difference. This 'maturity transformation' is the essential service banks provide — and their essential fragility.","The business is a bet that not everyone will ask for their money back at once."],
    ["The Bank Model","Net interest margin (NIM)","NIM = (interest earned − interest paid) ÷ average interest‑earning assets, typically 1.5–4%. It's the core profitability gauge of the lending engine, and it widens when asset yields rise faster than funding costs.","A few basis points of NIM across a trillion‑dollar book is very real money."],
    ["The Bank Model","Interest vs non‑interest income","Net interest income comes from the lending spread; non‑interest income from fees, commissions, trading, and services. The blend defines how rate‑sensitive — and how diversified — earnings are.","Boards prize fee income because it keeps paying when rates squeeze the spread."],
    ["The Bank Model","Fee & commission income","Money earned for services rather than for lending: account and card fees, advisory, asset management, transaction charges. It is capital‑light and sticky, so the market awards it a valuation premium.","Fee businesses turn a balance‑sheet lender into a services franchise."],
    ["The Bank Model","Financial intermediation","Banks sit between savers and borrowers, resolving mismatches in size, maturity, and risk appetite, and screening and monitoring borrowers that savers cannot. That intermediation is the value they add.","Disintermediation — fintech, capital markets, stablecoins — attacks exactly this middle."],
    ["The Bank Model","The spread","The gap between what a bank earns on assets and pays on liabilities. Almost everything in banking is engineered to widen this spread, protect it, or price risk correctly into it.","Grow the book, protect the spread, control the losses — the whole game in six words."],
    ["The Bank Model","Fractional reserve & money creation","Banks hold only a fraction of deposits in reserve and lend the rest; each loan becomes a new deposit elsewhere, which is lent again. Collectively the banking system creates money through lending, bounded by capital and reserves.","Banks don't merely move money — together they manufacture it."],
    ["The Bank Model","Deposits as funding","Customer deposits are a bank's cheapest, stickiest funding — often near‑zero cost and slow to leave. The quality of the deposit franchise is one of banking's strongest competitive moats.","Cheap, loyal deposits are the crown jewels; losing them raises the cost of everything."],
    ["The Bank Model","Wholesale vs retail funding","Retail funding is many small, sticky deposits. Wholesale funding is large, rate‑sensitive money from markets and institutions that can flee fast. Over‑reliance on wholesale funding was central to the 2008 failures.","Funding mix is a survival question, not merely a cost question."],
    ["The Bank Model","Cost of funds","The blended rate a bank pays across all its funding — deposits, debt, wholesale. It sets the floor under loan pricing: lend below cost of funds plus expenses plus expected loss and you lose money.","You cannot out‑grow a broken cost of funds."],

    // ---- Module 3: Balance Sheet ----
    ["Balance Sheet","Reading a bank balance sheet","For a bank the balance sheet is inverted from a normal firm: loans are assets (money owed to it), deposits are liabilities (money it owes). Equity is the thin sliver in between that absorbs losses.","A bank essentially is its balance sheet — the P&L is just what that balance sheet earns."],
    ["Balance Sheet","Assets & liabilities, mirrored","Your deposit is your asset but the bank's liability; your loan is the bank's asset but your liability. Grasping this mirror is the key to reading any bank's accounts.","One party's asset is always another's liability — banks industrialize that fact."],
    ["Balance Sheet","Equity / capital","Shareholders' funds: assets minus liabilities. It is the buffer that absorbs losses before depositors are touched, and the base against which returns (ROE) are measured — typically only 5–10% of the balance sheet.","Capital is both the shock absorber and the denominator of the scorecard."],
    ["Balance Sheet","Loan‑book composition","The mix of the asset side — mortgages, corporate loans, consumer credit, cards — sliced by sector and geography. Its concentration and quality drive both the yield earned and the losses suffered.","Show me the loan book's concentrations and I'll show you where the next crisis lands."],
    ["Balance Sheet","Off‑balance‑sheet items","Commitments and exposures not (yet) on the balance sheet: undrawn credit lines, guarantees, letters of credit, derivatives. They carry real risk and can crash onto the balance sheet in a crisis.","What's off the balance sheet has ended more banks than what's on it."],
    ["Balance Sheet","The income statement","Top line is net interest income plus fee income plus trading income. Subtract operating costs and loan‑loss provisions to reach pre‑tax profit. Provisions are the swing factor that turns good years bad.","Revenue is chosen; provisions are revealed — that's where the truth hides."],
    ["Balance Sheet","Return on assets (ROA)","Net income ÷ total assets — how efficiently the whole balance sheet generates profit. Around 1% is solid for a bank; low ROA is inherent, and banks make it up on volume and leverage.","Thin ROA is normal; the leverage stacked on top is what produces equity returns."],
    ["Balance Sheet","Return on equity (ROE)","Net income ÷ shareholders' equity — the headline profitability metric. ROE ≈ ROA × leverage, so a 1% ROA levered 10× yields a 10% ROE.","ROE only creates value when it clears the cost of equity — the number that rules the C‑suite."],
    ["Balance Sheet","Leverage","Banks fund assets mostly with debt and deposits, not equity, so assets can be 10–20× equity. Leverage magnifies ROE — and losses: a 5% asset loss at 15× leverage wipes out the equity.","Leverage is the amplifier — it makes good times great and bad times fatal."],
    ["Balance Sheet","Book value vs market value","Book value is accounting equity; market value is what investors will pay. A price‑to‑book above 1 means the market believes the bank earns above its cost of equity; below 1 signals doubt.","A sub‑1 price‑to‑book is the market saying your ROE doesn't cover its risk."],

    // ---- Module 4: Lending & Credit ----
    ["Lending & Credit","The credit process","Underwriting: assess the borrower, structure the loan, price for risk, approve within limits, then monitor to maturity. Disciplined origination is the cheapest form of risk management there is.","Losses are made at origination and merely recognized later."],
    ["Lending & Credit","The 5 Cs of credit","Character (track record), Capacity (cash flow to repay), Capital (the borrower's own stake), Collateral (backup security), and Conditions (economy and purpose). The timeless checklist of whom to lend to.","Frameworks age; the 5 Cs still explain most defaults."],
    ["Lending & Credit","Secured vs unsecured","Secured loans are backed by collateral the bank can seize (mortgages, auto loans); unsecured loans rely only on the promise to repay (cards, personal loans) and so carry higher rates and losses.","The absence of collateral must be priced — or it becomes a loss."],
    ["Lending & Credit","Collateral & loan‑to‑value","LTV = loan ÷ collateral value. An 80% LTV mortgage leaves a 20% equity cushion before the bank is underwater. Falling collateral values — a housing crash — turn once‑safe LTVs dangerous.","Collateral is only as good as its value in the exact stress you'll need it."],
    ["Lending & Credit","Credit risk & probability of default","Credit risk is the chance a borrower won't repay. PD is the estimated probability of default over a horizon, usually one year — the first input to sizing expected loss.","PD is a forecast, and forecasts fail precisely when everyone defaults together."],
    ["Lending & Credit","LGD & EAD","Loss Given Default is the fraction not recovered after default, net of collateral. Exposure at Default is how much is owed when default hits. With PD, they size the loss.","Recoveries (1 − LGD) are where good workout teams quietly earn their keep."],
    ["Lending & Credit","Expected loss (PD × LGD × EAD)","Expected loss = probability of default × loss given default × exposure at default. It's the average loss you plan for and price into the loan — covered by provisions and margin, not by capital.","Expected loss is a cost of doing business; unexpected loss is what capital exists for."],
    ["Lending & Credit","Loan‑loss provisions","Reserves set aside for expected credit losses. Modern rules — IFRS 9 and CECL — require booking expected losses on a forward‑looking basis rather than waiting for default, making provisions more volatile.","Provisioning timing shifts earnings between years — watch it like a hawk."],
    ["Lending & Credit","Non‑performing loans (NPLs)","Loans where the borrower has stopped paying, typically 90+ days overdue. The NPL ratio is a core asset‑quality gauge; rising NPLs eat capital and signal a deteriorating book.","NPL trends lead earnings — they tell you next year's provisions today."],
    ["Lending & Credit","Risk‑based loan pricing","Price = cost of funds + operating cost + expected loss + a capital charge + target margin. Riskier borrowers must pay more to cover their higher expected loss and heavier capital use.","Underprice risk to win volume and you're simply buying losses at a discount."],

    // ---- Module 5: Risk ----
    ["Risk","The four main risk types","Credit (borrowers don't pay), Market (prices move against you), Liquidity (you can't fund or settle), and Operational (people, process, systems fail). Nearly every bank loss maps to one of these four.","Different risks, one hard truth: they all correlate viciously in a crisis."],
    ["Risk","Concentration risk","Too much exposure to a single borrower, sector, geography, or collateral type. Diversification is the only free lunch; concentration is how 'safe' books blow up — energy, real estate, one counterparty.","Every large bank loss has a concentration story behind it."],
    ["Risk","Market risk & VaR","The risk that market prices — rates, FX, equities, credit spreads — move against trading positions. Value at Risk estimates the maximum loss over a horizon at a confidence level, but is blind to the tail beyond it.","VaR forecasts the weather, not the once‑in‑a‑decade storm — never confuse the two."],
    ["Risk","Liquidity risk","The risk of being unable to meet obligations as they fall due without fire‑selling assets. A bank can be perfectly solvent yet fail if it cannot fund itself — liquidity kills faster than credit.","Solvency is slow; a liquidity run is measured in hours."],
    ["Risk","Interest‑rate risk in the banking book","IRRBB is the risk that rate moves damage the value or income of non‑traded assets and liabilities — for example, funding long fixed‑rate mortgages with cheap deposits that suddenly reprice upward.","Silicon Valley Bank was, at its core, an unhedged IRRBB failure."],
    ["Risk","Operational risk","Loss from failed processes, people, systems, or external events — fraud, cyber, outages, mis‑selling, legal. Hard to quantify, unbounded in the tail, and increasingly the dominant risk in digital banking.","The next big loss may not be a bad loan — it may be a breach or a fine."],
    ["Risk","Model risk","The risk that the models banks rely on to price, value, and measure risk are simply wrong — bad assumptions, bad data, or use outside their design. 2008 was, in part, a model‑risk event.","A precise number from a wrong model is more dangerous than admitted uncertainty."],
    ["Risk","Three lines of defense","Line 1: the business owns its risk. Line 2: risk and compliance set limits and challenge. Line 3: internal audit checks it all works. This is the governance backbone of risk control.","When the three lines blur, accountability — and control — quietly disappear."],
    ["Risk","Risk appetite & RAROC","Risk appetite is the board's stated limit on risk taken for return. RAROC — risk‑adjusted return on capital — measures return per unit of risk capital, so businesses compete on efficiency, not just size.","Growth that ignores risk‑adjusted return destroys value while looking like success."],
    ["Risk","Stress testing","Simulating severe‑but‑plausible scenarios — recession, rate shock, market crash — to see whether capital and liquidity survive. Regulators mandate it (CCAR, EBA) and use it to gate dividends.","Stress tests are where the board learns what it can actually afford to lose."],

    // ---- Module 6: Capital & Rules ----
    ["Capital & Rules","Why capital matters","Capital is the equity buffer that absorbs unexpected losses so depositors and the system don't. Too little and a shock causes insolvency; too much and returns suffer. Calibrating it is the central regulatory tension.","Capital is the price of being allowed to take deposits."],
    ["Capital & Rules","The Basel framework","International standards — Basel I, II, and III — setting minimum capital, liquidity, and leverage rules for banks. Basel III, born after 2008, sharply raised the quality and quantity of capital and added liquidity rules.","Basel is the global rulebook that shapes what every bank can and cannot do."],
    ["Capital & Rules","Risk‑weighted assets (RWA)","Assets scaled by riskiness: cash near 0%, mortgages ~35%, unsecured corporate 100%+. Capital ratios are measured against RWA, so risky lending consumes far more capital than safe lending.","RWA is the currency of capital — where you lend decides how much you burn."],
    ["Capital & Rules","Capital ratios (CET1)","CET1 is the highest‑quality capital — common equity — divided by RWA, the headline solvency ratio; regulators demand minimums plus buffers, often 10%+. Tier 1 and Total capital add lower‑quality layers.","CET1 is the single number analysts, regulators, and rating agencies check first."],
    ["Capital & Rules","The leverage ratio","Tier 1 capital ÷ total exposure, un‑risk‑weighted. It's a backstop to the RWA ratios that can't be gamed through favorable risk‑weighting — it caps total leverage regardless of claimed risk.","The leverage ratio is the 'no matter how safe you think you are' floor."],
    ["Capital & Rules","Liquidity Coverage Ratio (LCR)","Requires enough high‑quality liquid assets to survive a 30‑day severe stress outflow. A direct response to 2008's funding runs — banks must hold a liquidity cushion, not merely capital.","LCR is the rule that says: survive the first month entirely on your own."],
    ["Capital & Rules","Net Stable Funding Ratio (NSFR)","Requires stable funding to cover longer‑term (one‑year) assets, discouraging over‑reliance on flighty short‑term money. It is the structural complement to the short‑term LCR.","NSFR forces the maturity‑transformation bet to be funded responsibly."],
    ["Capital & Rules","Capital buffers","Extra capital above the minimums: a conservation buffer (always on), a countercyclical buffer (raised in booms), and a G‑SIB surcharge for systemic banks. Breaching them restricts dividends and bonuses before failure.","Buffers are designed to be used in stress — hoarding them defeats the purpose."],
    ["Capital & Rules","Deposit insurance","A government guarantee of deposits up to a limit — $250k FDIC, €100k in the EU. It stops rational bank runs by removing the incentive to flee, arguably the cheapest financial‑stability tool ever invented.","Insurance buys calm; its limit is exactly where runs can still begin (see 2023)."],
    ["Capital & Rules","Lender of last resort","The central bank stands ready to lend to solvent‑but‑illiquid banks against good collateral, stopping panics from becoming collapses. Bagehot's rule: lend freely, at a penalty rate, on good collateral.","The backstop that makes fractional‑reserve banking survivable — and moral‑hazard‑prone."],

    // ---- Module 7: Treasury & ALM ----
    ["Treasury & ALM","Asset‑liability management","ALM is the central function that matches the maturities, rates, and currencies of assets and liabilities to manage interest‑rate and liquidity risk across the whole balance sheet.","ALM is where the bank decides how much of the borrow‑short/lend‑long bet to run."],
    ["Treasury & ALM","Banking book vs trading book","The banking book holds loans and deposits to maturity, accrual‑accounted. The trading book holds positions to trade, marked‑to‑market daily. They carry different risks, capital rules, and accounting.","The book an asset sits in changes its capital, its accounting, and its risk owner."],
    ["Treasury & ALM","Funds transfer pricing (FTP)","The internal 'price' treasury charges lending units for funds and pays deposit‑gathering units for raising them. It splits the spread fairly and reveals which businesses truly create value.","Get FTP wrong and you reward the wrong businesses and misprice the whole book."],
    ["Treasury & ALM","Interest‑rate gap & duration","Gap analysis measures the mismatch between assets and liabilities repricing in a period; duration measures price sensitivity to rate moves. Both quantify how a rate shock hits income and value.","A large unhedged gap is a leveraged bet on where rates go next."],
    ["Treasury & ALM","Hedging with swaps","Interest‑rate swaps let a bank convert fixed‑rate exposure into floating (or vice versa) without touching the underlying loans, neutralizing rate risk cheaply and flexibly.","Derivatives aren't the risk — failing to use them to hedge often is."],
    ["Treasury & ALM","Liquidity management","Holding a buffer of liquid assets and diversified funding so the bank can meet outflows in stress without fire sales. It's managed daily through cash‑flow forecasting and the liquidity buffer.","Liquidity is cheap to hold and priceless to have when markets freeze."],
    ["Treasury & ALM","Policy rate & transmission","The central bank sets a policy rate; it flows through money markets into deposit and loan rates, and thus into bank margins and the wider economy. This transmission is monetary policy in action.","When the central bank moves, treasury decides how much of it you pass on."],
    ["Treasury & ALM","Repo & money markets","Short‑term secured borrowing where securities are sold and repurchased — the plumbing banks use to fund positions and manage daily liquidity. A repo‑market freeze is a system‑wide seizure.","The repo market is invisible until it stops — then it is the whole story."],
    ["Treasury & ALM","Capital planning (ICAAP)","The bank's own forward‑looking, stress‑tested assessment of how much capital its risks require, reviewed by regulators. It links strategy, risk, and capital in a single process.","ICAAP is where 'how much risk can we run' meets 'how much capital do we have'."],
    ["Treasury & ALM","Capital return & dividends","Deciding how much profit to retain — to grow and buffer — versus return through dividends and buybacks. Regulators can block returns when capital or stress‑test results are weak.","Returning capital signals strength; being forced to cut it screams weakness."],

    // ---- Module 8: Payments & Ops ----
    ["Payments & Ops","Clearing & settlement","Clearing is agreeing who owes what; settlement is the actual transfer of funds. A payment you 'send' instantly may clear in seconds but settle hours or days later.","Between the click and settlement sit real risk — and real float."],
    ["Payments & Ops","Correspondent banking","Banks hold accounts with each other to move money across borders and currencies. A nostro is 'our' account held with them; a vostro is 'your' account held with us. It's the backbone of cross‑border payments.","This network is slow and costly — exactly what fintech and stablecoins target."],
    ["Payments & Ops","Cards: issuing, acquiring, interchange","Issuers give cards to consumers; acquirers sign up merchants; interchange is the network‑set fee that flows from acquirer to issuer on each swipe. It is a multi‑sided money machine.","Interchange is a quiet, huge, and heavily regulated profit pool."],
    ["Payments & Ops","Instant / real‑time payments","Systems like FedNow, UPI, and SEPA Instant clear and settle in seconds, 24/7. They compress float, accelerate fraud, and pressure the fees of the legacy rails.","Real‑time payments remove float — a revenue line and a risk window vanish together."],
    ["Payments & Ops","SWIFT & cross‑border","SWIFT is the messaging network banks use to instruct cross‑border payments — it moves messages, not money. Slow, layered, and costly, it's the friction fintech and CBDCs aim to remove.","SWIFT is messaging, not money — a distinction that explains most cross‑border pain."],
    ["Payments & Ops","RTGS & central‑bank money","Real‑Time Gross Settlement systems settle large payments individually and irrevocably in central‑bank money — the ultimate risk‑free settlement asset — and form the core of national payment systems.","Central‑bank money is the only truly final settlement — everything else is a promise."],
    ["Payments & Ops","AML, KYC & fraud","Know Your Customer and Anti‑Money‑Laundering rules require banks to verify identity and monitor for illicit flows. Failures bring enormous fines and reputational damage.","Compliance isn't overhead — one AML failure can cost billions and a banking license."],
    ["Payments & Ops","Reconciliation & the back office","The unglamorous work of matching records so every transaction balances. Breaks here signal fraud, error, or loss; strong operations are a genuine competitive edge.","Operational excellence rarely makes headlines but constantly prevents losses."],
    ["Payments & Ops","Float & settlement risk","Float is money in transit that neither party can use; settlement (Herstatt) risk is that one side pays and the other fails before completing. Timing gaps are a real, historic source of loss.","The gap between pay and receive is where a counterparty's failure becomes your loss."],
    ["Payments & Ops","Cost‑to‑income ratio","Operating costs ÷ income — the efficiency benchmark. Below ~50% is strong; above ~65% signals bloat. It's the lever that technology and scale most directly move.","Cost‑to‑income is the metric activists and boards use to judge management's grip."],

    // ---- Module 9: Markets & Fees ----
    ["Markets & Fees","Investment vs commercial banking","Commercial banks take deposits and lend; investment banks advise, underwrite, and trade for corporates and institutions. Universal banks do both under one roof, with walls between them.","The two mix funding stability with fee upside — and blend their risks too."],
    ["Markets & Fees","Capital markets: debt & equity","Instead of lending, banks help clients raise money directly from investors — issuing bonds (debt) or shares (equity, IPOs). The bank earns fees while taking little balance‑sheet risk.","Capital‑markets fees are prized: high margin, capital‑light, and cyclical."],
    ["Markets & Fees","Securitization","Pooling loans — mortgages, cards, auto — and selling them as tradable securities, moving risk off the balance sheet and freeing capital to lend again. Misused, it fueled the 2008 crisis.","A powerful capital tool that becomes a weapon when the underlying quality is hidden."],
    ["Markets & Fees","Wealth & asset management","Managing money for individuals (wealth) and institutions (asset management) for recurring fees. Capital‑light, sticky, and scalable — the segment banks covet most.","AUM‑based fees are the annuity every bank CEO wants more of."],
    ["Markets & Fees","Trade finance","Financing and de‑risking global trade — letters of credit, guarantees, supply‑chain finance — so exporters and importers can trust each other. Old, essential, and fee‑rich.","Trade finance greases global commerce and ties clients in with sticky, low‑loss business."],
    ["Markets & Fees","Treasury & FX services","Helping clients manage currency, rates, and liquidity — FX conversion, hedging, cash management. It's high‑volume, recurring, relationship‑anchoring revenue.","These services deepen client relationships and throw off steady, low‑risk fees."],
    ["Markets & Fees","Derivatives basics","Contracts whose value derives from an underlying — rate, FX, commodity, equity. Forwards lock a price, options grant a right, swaps exchange cash flows. Tools to hedge or to speculate.","Derivatives transfer risk — the danger is never knowing who finally holds it."],
    ["Markets & Fees","Trading & market‑making","Banks quote buy and sell prices, earning the bid‑ask spread and providing liquidity. It's profitable but volatile and capital‑hungry; post‑2008 rules curbed proprietary risk‑taking.","Trading income flatters the good years and can detonate the bad ones."],
    ["Markets & Fees","Universal vs specialist banks","Universal banks span retail, corporate, investment, and markets; specialists focus — a card issuer, a private bank. Breadth diversifies revenue but adds complexity and systemic risk.","Diversification versus focus is a perennial strategic and valuation debate."],
    ["Markets & Fees","Fee‑income diversification","Spreading revenue across lending and multiple fee streams so earnings survive any single shock or rate cycle. Investors pay more for diversified, recurring income.","The market rewards durable fee income with a higher multiple than volatile spread income."],

    // ---- Module 10: Strategy & Value ----
    ["Strategy & Value","What drives bank valuation","Banks trade on price‑to‑book — tied to ROE versus cost of equity — more than on P/E. If ROE exceeds COE, the stock trades above book; if not, below. Growth, risk, and returns set the multiple.","The whole equity story reduces to: does your ROE beat your cost of equity?"],
    ["Strategy & Value","Cost of equity & the ROE > COE rule","Cost of equity is the return shareholders demand for the risk they bear. A bank creates value only when ROE exceeds COE; earning below it destroys value even while reporting a profit.","'Profitable' and 'value‑destroying' aren't opposites — a bank can be both at once."],
    ["Strategy & Value","Economic profit / EVA","Profit after charging for all capital used, including equity at its cost. It exposes whether a business truly adds value or merely consumes expensive capital to look busy.","Accounting profit flatters; economic profit tells the truth about value."],
    ["Strategy & Value","The efficiency lever","Cutting cost‑to‑income — through automation, scale, and simplification — flows almost directly to the bottom line and ROE. It's the most controllable value lever management holds.","When revenue is hard to grow, efficiency is the lever a CEO can actually pull."],
    ["Strategy & Value","Digital & fintech disruption","Fintechs and big tech attack the profitable, capital‑light slices — payments, lending, advice — with better UX and lower cost, unbundling the bank. Incumbents defend with trust, scale, deposits, and licenses.","The threat isn't one rival — it's a thousand cuts to your best margins."],
    ["Strategy & Value","Customer unit economics","Value per customer = lifetime value (products × margin × tenure) minus acquisition cost. Cross‑sell and retention, not just acquisition, drive real profitability.","The war is won on cross‑sell and retention, not on flashy acquisition numbers."],
    ["Strategy & Value","Regulatory & reputational risk","Beyond financial risk, fines, license loss, and reputational damage can dwarf any single loan loss. In a trust business, reputation is capital — and it compounds in both directions.","In banking, trust is the balance sheet you can't rebuild overnight."],
    ["Strategy & Value","Capital as the scarce resource","Capital limits how much a bank can lend and grow, so allocating it to the highest risk‑adjusted returns is the core strategic act. Every business competes for the same scarce capital.","The CEO's real job is deciding where each unit of capital earns the most."],
    ["Strategy & Value","Growth / risk / return trade‑off","You can chase growth, safety, or returns — rarely all three at once. Fast growth often means loosening credit; high returns often mean more risk. Managing that tension is strategy.","Beware the bank growing fastest — someone is usually underpricing risk to do it."],
    ["Strategy & Value","The CEO scorecard","The metrics that truly judge a bank CEO: ROE versus COE, CET1 capital, cost‑to‑income, NIM, asset quality, and total shareholder return — all balanced against risk. Everything ladders up to these.","Run the bank to these numbers and the share price follows; chase the price alone and they betray you."]
  ].map((c, i) => ({ n: i + 1, cat: c[0], concept: c[1], explain: c[2], lens: c[3] }));
