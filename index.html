  const I18N = {"ru":{"modules":{"Interest & Money":"Проценты и деньги","The Bank Model":"Модель банка","Balance Sheet":"Баланс","Lending & Credit":"Кредитование","Risk":"Риски","Capital & Rules":"Капитал и регулирование","Treasury & ALM":"Казначейство и ALM","Payments & Ops":"Платежи и операции","Markets & Fees":"Рынки и комиссии","Strategy & Value":"Стратегия и стоимость"},"ui":{"tagline1":"Как устроен банкинг","tagline2":"100 карточек до уровня топ-менеджмента","cardLabel":"Карточка","masteredLabel":"Освоено","all":"Все","reveal":"Раскрыть подробности","masteredFlag":"Освоено","lensLabel":"Взгляд топ-менеджера","flip":"Перевернуть","master":"Освоить","shuffle":"Перемешать","kbNav":"навигация","kbFlip":"перевернуть","kbMaster":"освоить","kbShuffle":"перемешать","cardAria":"Флеш-карточка. Активируйте, чтобы увидеть ответ.","prevAria":"Предыдущая карточка","nextAria":"Следующая карточка","flipAria":"Перевернуть карточку","markAria":"Отметить как освоенную","shuffleAria":"Перемешать колоду"},"cards":{"1":{"concept":"Как возникает процент","explain":"Процент — это цена времени. Доллар сегодня стоит больше, чем доллар завтра, потому что его можно пустить в дело, а завтрашний день несёт риск и инфляцию. Процент — это то, что кредитор берёт за отказ от временной ценности денег, за компенсацию ожидаемой инфляции и за риск того, что деньги не вернут.","lens":"Любой продукт, который продаёт банк, по сути — это сдача времени и риска в аренду."},"2":{"concept":"Простые и сложные проценты","explain":"Простые проценты начисляются только на первоначальную сумму. Сложные проценты начисляются на основную сумму плюс весь накопленный процент, поэтому растут экспоненциально, а не линейно. На длинных горизонтах капитализация доминирует — вот почему частота начисления и время важнее, чем заявленная ставка.","lens":"Небольшие различия в ставках или комиссиях складываются в огромную стоимость за срок жизни портфеля."},"3":{"concept":"Номинальные и реальные ставки","explain":"Номинальная ставка — это заявленная ставка; реальная ставка очищена от инфляции (реальная ≈ номинальная − инфляция — соотношение Фишера). Кредит под 6% при инфляции 5% приносит лишь около 1% реальной покупательной способности.","lens":"Маржа, выглядящая здоровой в номинальном выражении, может оказаться тонкой — или отрицательной — в реальном."},"4":{"concept":"APR и APY (эффективная доходность)","explain":"APR — это простая годовая ставка, игнорирующая внутригодовую капитализацию; APY (или EAR) учитывает капитализацию, поэтому всегда ≥ APR. 12% с ежемесячной капитализацией — это фактически около 12,68%. Правила раскрытия информации определяют, какую из них обязаны показать клиенту.","lens":"То, как вы объявляете ставку, меняет и число, которое видит клиент, и то, что вы реально зарабатываете."},"5":{"concept":"Приведённая стоимость и дисконтирование","explain":"Приведённая стоимость переводит будущие деньги в сегодняшние, деля их на (1+r)ᵗ — коэффициент дисконтирования. Это движок за ценообразованием кредитов, оценкой облигаций и любым вопросом «сколько этот будущий поток стоит сейчас?».","lens":"Дисконтирование — это то, как банк назначает цену всему, что приносит выплаты во времени."},"6":{"concept":"Безрисковая ставка","explain":"Теоретическая доходность вложения без риска дефолта, аппроксимируемая краткосрочным госдолгом вроде казначейских векселей. Это фундамент, на котором строится любая другая ставка: рисковая ставка = безрисковая ставка + спреды за кредитный риск, ликвидность и срочность.","lens":"Когда безрисковая ставка сдвигается, переоценивается каждый актив на балансе."},"7":{"concept":"Инфляция и покупательная способность","explain":"Инфляция со временем разъедает то, что можно купить на деньги. Банк ощущает её дважды: она съедает реальную стоимость удерживаемых им кредитов с фиксированной ставкой и определяет решения центробанка по ставке, которые пересматривают стоимость его фондирования.","lens":"Инфляция тихо перераспределяет стоимость между заёмщиками и вкладчиками банка."},"8":{"concept":"Частота капитализации","explain":"Чем чаще начисляется процент — ежегодно, затем ежемесячно, ежедневно, непрерывно — тем выше эффективная доходность при той же номинальной ставке. Непрерывная капитализация использует eʳᵗ и лежит в основе ценообразования деривативов.","lens":"Частота — это рычаг: она меняет реальную экономику, не трогая рекламируемую ставку."},"9":{"concept":"Фиксированные и плавающие ставки","explain":"Фиксированная ставка зафиксирована на срок; плавающая периодически пересматривается относительно бенчмарка (SOFR, EURIBOR) плюс маржа. Фиксированные ставки перекладывают процентный риск на кредитора; плавающие — на заёмщика.","lens":"Соотношение фиксированных и плавающих ставок в портфеле решает, кто пострадает при движении ставок."},"10":{"concept":"Срочность и кривая доходности","explain":"Кривая доходности отражает зависимость процентной ставки от срока. Обычно она имеет восходящий наклон — дольше означает большую доходность за срочность и инфляционный риск — тогда как инвертированная кривая (короткие ставки выше длинных) исторически предупреждала о рецессии.","lens":"Наклон кривой — это, в одну строку, прогноз погоды для банковской маржи."},"11":{"concept":"Занимать коротко, кредитовать длинно","explain":"Банки привлекают краткосрочные, возвратные по требованию депозиты и превращают их в долгосрочные, неликвидные кредиты, забирая разницу. Эта «трансформация сроков» — ключевая услуга банков и одновременно их ключевая уязвимость.","lens":"Бизнес построен на ставке, что не все попросят вернуть деньги одновременно."},"12":{"concept":"Чистая процентная маржа (NIM)","explain":"NIM = (заработанные проценты − уплаченные проценты) ÷ средние процентные активы, обычно 1,5–4%. Это ключевой показатель прибыльности кредитного механизма, и он расширяется, когда доходность активов растёт быстрее стоимости фондирования.","lens":"Несколько базисных пунктов NIM на портфеле в триллион долларов — это вполне реальные деньги."},"13":{"concept":"Процентный и непроцентный доход","explain":"Чистый процентный доход приходит от кредитного спреда; непроцентный доход — от комиссий, вознаграждений, торговли и услуг. Их сочетание определяет, насколько чувствительна к ставкам — и насколько диверсифицирована — прибыль.","lens":"Советы директоров ценят комиссионный доход, потому что он продолжает поступать, когда ставки сжимают спред."},"14":{"concept":"Комиссионный доход","explain":"Деньги, заработанные за услуги, а не за кредитование: комиссии по счетам и картам, консультации, управление активами, транзакционные сборы. Он не требует капитала и устойчив, поэтому рынок присуждает ему премию к оценке.","lens":"Комиссионный бизнес превращает балансового кредитора в сервисную франшизу."},"15":{"concept":"Финансовое посредничество","explain":"Банки стоят между сберегателями и заёмщиками, разрешая несоответствия по размеру, срочности и аппетиту к риску, а также отбирая и мониторя заёмщиков, чего сберегатели сделать не могут. Это посредничество и есть та ценность, что они добавляют.","lens":"Дезинтермедиация — финтех, рынки капитала, стейблкоины — атакует именно эту середину."},"16":{"concept":"Спред","explain":"Разрыв между тем, что банк зарабатывает на активах, и тем, что платит по обязательствам. Почти всё в банкинге сконструировано для того, чтобы расширить этот спред, защитить его или корректно заложить в него риск.","lens":"Растить портфель, защищать спред, контролировать потери — вся игра в шести словах."},"17":{"concept":"Частичное резервирование и создание денег","explain":"Банки держат в резерве лишь долю депозитов, а остальное выдают в кредит; каждый кредит становится новым депозитом в другом месте, который снова выдают. Коллективно банковская система создаёт деньги через кредитование, ограниченная капиталом и резервами.","lens":"Банки не просто перемещают деньги — вместе они их производят."},"18":{"concept":"Депозиты как источник фондирования","explain":"Клиентские депозиты — самое дешёвое и устойчивое фондирование банка, зачастую почти бесплатное и медленно уходящее. Качество депозитной франшизы — один из сильнейших конкурентных рвов в банкинге.","lens":"Дешёвые лояльные депозиты — это фамильные драгоценности; потерять их — значит удорожить всё."},"19":{"concept":"Оптовое и розничное фондирование","explain":"Розничное фондирование — это множество мелких, устойчивых депозитов. Оптовое фондирование — крупные, чувствительные к ставкам деньги с рынков и от институтов, способные быстро сбежать. Чрезмерная опора на оптовое фондирование была центральной в крахах 2008 года.","lens":"Структура фондирования — это вопрос выживания, а не просто вопрос стоимости."},"20":{"concept":"Стоимость фондирования","explain":"Смешанная ставка, которую банк платит по всему своему фондированию — депозитам, долгу, оптовым деньгам. Она задаёт нижнюю границу ценообразования кредитов: выдай кредит ниже стоимости фондирования плюс расходов плюс ожидаемых потерь — и теряешь деньги.","lens":"Ростом не перекрыть сломанную стоимость фондирования."},"21":{"concept":"Как читать банковский баланс","explain":"У банка баланс перевёрнут относительно обычной компании: кредиты — это активы (деньги, которые ему должны), депозиты — обязательства (деньги, которые должен он). Капитал — тонкая прослойка между ними, поглощающая потери.","lens":"Банк, по сути, и есть свой баланс — отчёт о прибылях лишь показывает, сколько этот баланс зарабатывает."},"22":{"concept":"Активы и обязательства как зеркало","explain":"Ваш депозит — ваш актив, но обязательство банка; ваш кредит — актив банка, но ваше обязательство. Понимание этого зеркала — ключ к чтению счетов любого банка.","lens":"Актив одной стороны всегда является обязательством другой — банки ставят этот факт на промышленную основу."},"23":{"concept":"Собственный капитал","explain":"Средства акционеров: активы минус обязательства. Это буфер, поглощающий потери, прежде чем они затронут вкладчиков, и база, относительно которой измеряется доходность (ROE) — обычно лишь 5–10% баланса.","lens":"Капитал — одновременно амортизатор потрясений и знаменатель в оценочной карте."},"24":{"concept":"Структура кредитного портфеля","explain":"Состав активной части — ипотека, корпоративные кредиты, потребительские займы, карты — в разрезе секторов и географии. Её концентрация и качество определяют и зарабатываемую доходность, и понесённые потери.","lens":"Покажите мне концентрации кредитного портфеля — и я покажу, где случится следующий кризис."},"25":{"concept":"Забалансовые статьи","explain":"Обязательства и риски, (пока) не отражённые на балансе: невыбранные кредитные линии, гарантии, аккредитивы, деривативы. Они несут реальный риск и в кризис могут обрушиться на баланс.","lens":"То, что вне баланса, погубило больше банков, чем то, что на нём."},"26":{"concept":"Отчёт о прибылях и убытках","explain":"Верхняя строка — чистый процентный доход плюс комиссионный доход плюс торговый доход. Вычтите операционные расходы и резервы под кредитные потери, чтобы получить прибыль до налогов. Резервы — тот переменный фактор, что превращает хорошие годы в плохие.","lens":"Выручку выбирают; резервы обнаруживают — вот где прячется правда."},"27":{"concept":"Рентабельность активов (ROA)","explain":"Чистая прибыль ÷ совокупные активы — насколько эффективно весь баланс генерирует прибыль. Около 1% — солидный показатель для банка; низкая ROA присуща отрасли, и банки компенсируют её объёмом и левериджем.","lens":"Тонкая ROA — это норма; доходность капитала создаёт именно нагромождённый сверху леверидж."},"28":{"concept":"Рентабельность капитала (ROE)","explain":"Чистая прибыль ÷ акционерный капитал — главная метрика прибыльности. ROE ≈ ROA × леверидж, поэтому ROA в 1% при левередже 10× даёт ROE в 10%.","lens":"ROE создаёт стоимость лишь тогда, когда превышает стоимость капитала — число, которое правит топ-менеджментом."},"29":{"concept":"Леверидж","explain":"Банки финансируют активы в основном долгом и депозитами, а не капиталом, поэтому активы могут в 10–20 раз превышать капитал. Леверидж усиливает ROE — и потери: убыток по активам в 5% при левередже 15× уничтожает капитал.","lens":"Леверидж — это усилитель: он делает хорошие времена прекрасными, а плохие — смертельными."},"30":{"concept":"Балансовая и рыночная стоимость","explain":"Балансовая стоимость — это бухгалтерский капитал; рыночная — то, что готовы заплатить инвесторы. Коэффициент цена/балансовая стоимость выше 1 означает, что рынок верит: банк зарабатывает выше стоимости капитала; ниже 1 — сигнал сомнения.","lens":"Коэффициент цена/капитал ниже 1 — это рынок, говорящий, что ваша ROE не покрывает риск."},"31":{"concept":"Кредитный процесс","explain":"Андеррайтинг: оценить заёмщика, структурировать кредит, заложить цену за риск, одобрить в рамках лимитов, а затем мониторить до погашения. Дисциплинированная выдача — самая дешёвая форма управления риском из существующих.","lens":"Потери создаются в момент выдачи и лишь позже признаются."},"32":{"concept":"Пять «C» кредита","explain":"Character (репутация и история), Capacity (денежный поток для погашения), Capital (собственный вклад заёмщика), Collateral (обеспечение), Conditions (экономика и цель). Вечный чек-лист того, кому давать в долг.","lens":"Модели стареют; пять «C» по-прежнему объясняют большинство дефолтов."},"33":{"concept":"Обеспеченные и необеспеченные кредиты","explain":"Обеспеченные кредиты подкреплены залогом, который банк может изъять (ипотека, автокредиты); необеспеченные опираются лишь на обещание вернуть (карты, потребкредиты) и потому несут более высокие ставки и потери.","lens":"Отсутствие залога должно быть заложено в цену — иначе оно превращается в убыток."},"34":{"concept":"Залог и коэффициент LTV","explain":"LTV = кредит ÷ стоимость залога. Ипотека с LTV 80% оставляет 20% запаса капитала, прежде чем банк уйдёт в минус. Падение стоимости залога — обвал на рынке жилья — делает прежде безопасные LTV опасными.","lens":"Залог хорош ровно настолько, насколько сохраняет стоимость в том самом стрессе, когда он вам понадобится."},"35":{"concept":"Кредитный риск и вероятность дефолта","explain":"Кредитный риск — вероятность того, что заёмщик не вернёт долг. PD — оценочная вероятность дефолта на горизонте, обычно одном годе, — первый вход для расчёта ожидаемых потерь.","lens":"PD — это прогноз, а прогнозы дают сбой именно тогда, когда все объявляют дефолт разом."},"36":{"concept":"LGD и EAD","explain":"LGD (Loss Given Default) — доля, не возмещённая после дефолта за вычетом залога. EAD (Exposure at Default) — сумма задолженности на момент дефолта. Вместе с PD они определяют размер потерь.","lens":"Возмещения (1 − LGD) — это то, где хорошие команды по взысканию тихо оправдывают своё содержание."},"37":{"concept":"Ожидаемые потери (PD × LGD × EAD)","explain":"Ожидаемые потери = вероятность дефолта × потери при дефолте × сумма под риском. Это средние потери, которые вы планируете и закладываете в цену кредита — они покрываются резервами и маржой, а не капиталом.","lens":"Ожидаемые потери — это издержки ведения бизнеса; непредвиденные потери — то, ради чего существует капитал."},"38":{"concept":"Резервы под кредитные потери","explain":"Резервы, откладываемые под ожидаемые кредитные потери. Современные стандарты — IFRS 9 и CECL — требуют признавать ожидаемые потери на перспективной основе, а не ждать дефолта, что делает резервы более волатильными.","lens":"Сроки формирования резервов перекладывают прибыль между годами — следите за этим в оба глаза."},"39":{"concept":"Проблемные кредиты (NPL)","explain":"Кредиты, по которым заёмщик перестал платить, обычно с просрочкой 90+ дней. Доля NPL — ключевой индикатор качества активов; их рост съедает капитал и сигнализирует об ухудшении портфеля.","lens":"Динамика NPL опережает прибыль — она сегодня подсказывает резервы следующего года."},"40":{"concept":"Ценообразование кредитов с учётом риска","explain":"Цена = стоимость фондирования + операционные издержки + ожидаемые потери + плата за капитал + целевая маржа. Более рискованные заёмщики должны платить больше, чтобы покрыть свои более высокие ожидаемые потери и более тяжёлое потребление капитала.","lens":"Занизьте цену риска ради объёма — и вы попросту покупаете убытки со скидкой."},"41":{"concept":"Четыре основных вида риска","explain":"Кредитный (заёмщики не платят), рыночный (цены движутся против вас), ликвидности (вы не можете профондироваться или рассчитаться) и операционный (сбой людей, процессов, систем). Почти любой убыток банка сводится к одному из этих четырёх.","lens":"Разные риски, одна жёсткая истина: в кризис они все злобно коррелируют."},"42":{"concept":"Риск концентрации","explain":"Слишком большая подверженность одному заёмщику, сектору, географии или типу залога. Диверсификация — единственный бесплатный обед; концентрация — то, как взрываются «безопасные» портфели: энергетика, недвижимость, один контрагент.","lens":"За каждым крупным убытком банка стоит история концентрации."},"43":{"concept":"Рыночный риск и VaR","explain":"Риск того, что рыночные цены — ставки, валюта, акции, кредитные спреды — сдвинутся против торговых позиций. VaR (Value at Risk) оценивает максимальный убыток на горизонте при заданном уровне доверия, но слеп к хвосту за его пределами.","lens":"VaR прогнозирует погоду, а не шторм раз в десятилетие — никогда не путайте одно с другим."},"44":{"concept":"Риск ликвидности","explain":"Риск оказаться неспособным исполнить обязательства в срок без экстренной распродажи активов. Банк может быть абсолютно платёжеспособным и всё же рухнуть, если не сможет профондироваться — ликвидность убивает быстрее кредита.","lens":"Неплатёжеспособность приходит медленно; набег на ликвидность измеряется часами."},"45":{"concept":"Процентный риск банковской книги (IRRBB)","explain":"IRRBB — риск того, что движения ставок ударят по стоимости или доходу неторговых активов и обязательств — например, фондирование долгой ипотеки по фиксированной ставке дешёвыми депозитами, которые внезапно переоцениваются вверх.","lens":"Silicon Valley Bank в своей основе был крахом непрохеджированного IRRBB."},"46":{"concept":"Операционный риск","explain":"Убыток от сбоев процессов, людей, систем или внешних событий — мошенничество, кибератаки, сбои, недобросовестные продажи, судебные иски. Труден для количественной оценки, безграничен в хвосте и всё чаще доминирует в цифровом банкинге.","lens":"Следующий крупный убыток может оказаться не плохим кредитом, а утечкой данных или штрафом."},"47":{"concept":"Модельный риск","explain":"Риск того, что модели, на которые банки полагаются для ценообразования, оценки и измерения риска, попросту неверны — плохие допущения, плохие данные или применение вне области их разработки. 2008 год был отчасти событием модельного риска.","lens":"Точное число из неверной модели опаснее, чем признанная неопределённость."},"48":{"concept":"Три линии защиты","explain":"Линия 1: бизнес владеет своим риском. Линия 2: риск и комплаенс задают лимиты и оспаривают решения. Линия 3: внутренний аудит проверяет, что всё работает. Это управленческий костяк контроля над рисками.","lens":"Когда три линии размываются, тихо исчезают и подотчётность, и контроль."},"49":{"concept":"Аппетит к риску и RAROC","explain":"Аппетит к риску — заявленный советом директоров лимит риска, принимаемого ради доходности. RAROC (доходность на капитал с поправкой на риск) измеряет отдачу на единицу рискового капитала, так что бизнесы конкурируют эффективностью, а не только размером.","lens":"Рост, игнорирующий доходность с поправкой на риск, разрушает стоимость, выглядя как успех."},"50":{"concept":"Стресс-тестирование","explain":"Моделирование тяжёлых, но правдоподобных сценариев — рецессия, шок ставок, обвал рынка — чтобы проверить, выживут ли капитал и ликвидность. Регуляторы предписывают его (CCAR, EBA) и используют для допуска к выплате дивидендов.","lens":"Стресс-тесты — это то, где совет директоров узнаёт, сколько он на самом деле может позволить себе потерять."},"51":{"concept":"Зачем нужен капитал","explain":"Капитал — это буфер собственных средств, который поглощает непредвиденные убытки, чтобы их не приняли на себя вкладчики и вся система. Слишком мало капитала — и шок ведёт к неплатёжеспособности; слишком много — и страдает доходность. Поиск баланса и есть центральное противоречие регулирования.","lens":"Капитал — это цена за право привлекать депозиты."},"52":{"concept":"Базельские стандарты","explain":"Международные стандарты — Базель I, II и III — устанавливают минимальные требования к капиталу, ликвидности и левериджу банков. Базель III, появившийся после кризиса 2008 года, резко повысил качество и объём капитала и добавил требования к ликвидности.","lens":"Базель — глобальный свод правил, определяющий, что банк может и чего не может делать."},"53":{"concept":"Активы, взвешенные по риску (RWA)","explain":"Активы, масштабированные по степени риска: наличные — около 0%, ипотека — ~35%, необеспеченный корпоративный кредит — 100% и выше. Нормативы капитала считаются относительно RWA, поэтому рискованное кредитование потребляет намного больше капитала, чем безопасное.","lens":"RWA — валюта капитала: то, куда вы кредитуете, определяет, сколько его вы сжигаете."},"54":{"concept":"Нормативы капитала (CET1)","explain":"CET1 — капитал высшего качества (обыкновенный акционерный) — делится на RWA и даёт ключевой норматив достаточности; регуляторы требуют минимума плюс буферов, часто от 10%. Капитал первого уровня (Tier 1) и совокупный капитал добавляют слои более низкого качества.","lens":"CET1 — тот единственный показатель, который аналитики, регуляторы и рейтинговые агентства проверяют в первую очередь."},"55":{"concept":"Норматив левериджа","explain":"Капитал первого уровня (Tier 1) ÷ совокупная величина риска, без взвешивания по риску. Это подстраховка для нормативов на базе RWA, которую нельзя обойти через выгодное взвешивание рисков — она ограничивает общий леверидж независимо от заявленного риска.","lens":"Норматив левериджа — это тот самый пол «как бы безопасно вы себя ни считали»."},"56":{"concept":"Норматив краткосрочной ликвидности (LCR)","explain":"Требует держать достаточно высоколиквидных активов, чтобы пережить 30-дневный отток при жёстком стрессе. Прямой ответ на набеги на фондирование 2008 года: банки должны иметь подушку ликвидности, а не только капитал.","lens":"LCR — это правило: первый месяц продержись полностью на своих силах."},"57":{"concept":"Норматив чистого стабильного фондирования (NSFR)","explain":"Требует, чтобы стабильное фондирование покрывало более долгосрочные (годовые) активы, ограничивая чрезмерную зависимость от неустойчивых коротких денег. Это структурное дополнение к краткосрочному LCR.","lens":"NSFR заставляет ответственно фондировать саму ставку на трансформацию сроков."},"58":{"concept":"Буферы капитала","explain":"Капитал сверх минимумов: буфер консервации (действует всегда), контрциклический буфер (повышается на подъёмах) и надбавка для системно значимых банков (G-SIB). Их нарушение ограничивает дивиденды и бонусы ещё до банкротства.","lens":"Буферы созданы, чтобы их тратить в стрессе — копить их значит перечёркивать их смысл."},"59":{"concept":"Страхование вкладов","explain":"Государственная гарантия по вкладам в пределах лимита — 250 тыс. долл. по линии FDIC, 100 тыс. евро в ЕС. Она гасит рациональные набеги на банки, убирая стимул бежать, и, возможно, является самым дешёвым инструментом финансовой стабильности из когда-либо изобретённых.","lens":"Страхование покупает спокойствие; его лимит — ровно та черта, за которой набеги всё ещё возможны (см. 2023 год)."},"60":{"concept":"Кредитор последней инстанции","explain":"Центральный банк готов кредитовать платёжеспособные, но временно неликвидные банки под хорошее обеспечение, не давая панике перерасти в крах. Правило Бэджета: кредитуй щедро, по штрафной ставке, под надёжный залог.","lens":"Та самая подстраховка, что делает частичное резервирование выживаемым — и порождает моральный риск."},"61":{"concept":"Управление активами и пассивами (ALM)","explain":"ALM — центральная функция, которая согласует сроки, ставки и валюты активов и обязательств, управляя процентным риском и риском ликвидности по всему балансу.","lens":"В ALM банк решает, какую долю ставки «занимай коротко — кредитуй длинно» отыгрывать."},"62":{"concept":"Банковская книга и торговая книга","explain":"Банковская книга держит кредиты и депозиты до погашения и учитывается по начислению. Торговая книга держит позиции для торговли и ежедневно переоценивается по рынку. У них разные риски, требования к капиталу и учёт.","lens":"Книга, в которой сидит актив, меняет его капитал, его учёт и владельца риска."},"63":{"concept":"Трансфертное ценообразование (FTP)","explain":"Внутренняя «цена», которую казначейство берёт с кредитующих подразделений за средства и платит привлекающим депозиты за их привлечение. FTP справедливо делит спред и показывает, какие бизнесы реально создают стоимость.","lens":"Ошибись в FTP — и вознаградишь не те бизнесы и неверно оценишь весь портфель."},"64":{"concept":"Процентный гэп и дюрация","explain":"Гэп-анализ измеряет разрыв между активами и обязательствами, переоцениваемыми в заданном периоде; дюрация измеряет чувствительность цены к движению ставок. Оба показателя количественно оценивают, как процентный шок бьёт по доходу и стоимости.","lens":"Крупный незахеджированный гэп — это ставка с плечом на то, куда пойдут ставки."},"65":{"concept":"Хеджирование свопами","explain":"Процентные свопы позволяют банку превратить фиксированную ставку в плавающую (или наоборот), не трогая сами кредиты, дёшево и гибко нейтрализуя процентный риск.","lens":"Риск не в деривативах — чаще риск в том, что их не используют для хеджа."},"66":{"concept":"Управление ликвидностью","explain":"Держать подушку ликвидных активов и диверсифицированное фондирование, чтобы банк мог покрыть оттоки в стрессе без вынужденных распродаж. Управляется ежедневно через прогноз денежных потоков и буфер ликвидности.","lens":"Ликвидность дёшево держать и бесценно иметь, когда рынки замерзают."},"67":{"concept":"Ключевая ставка и трансмиссия","explain":"Центральный банк задаёт ключевую ставку; через денежный рынок она перетекает в ставки по депозитам и кредитам, а значит — в маржу банков и в экономику в целом. Эта трансмиссия и есть денежно-кредитная политика в действии.","lens":"Когда центробанк двигает ставку, казначейство решает, какую её часть переложить дальше."},"68":{"concept":"Репо и денежные рынки","explain":"Краткосрочное обеспеченное заимствование, где ценные бумаги продаются и выкупаются обратно — сантехника, которой банки фондируют позиции и управляют дневной ликвидностью. Заморозка рынка репо — это остановка всей системы.","lens":"Рынок репо незаметен, пока он работает — а стоит ему встать, он и есть вся история."},"69":{"concept":"Планирование капитала (ICAAP)","explain":"Собственная, ориентированная на будущее и проверенная стрессом оценка банком того, сколько капитала требуют его риски, рассматриваемая регуляторами. ICAAP связывает стратегию, риск и капитал в едином процессе.","lens":"В ICAAP «сколько риска мы можем нести» встречается со «сколько капитала у нас есть»."},"70":{"concept":"Возврат капитала и дивиденды","explain":"Решение о том, сколько прибыли удержать — на рост и буфер — против того, чтобы вернуть её дивидендами и выкупом акций. Регуляторы могут заблокировать выплаты, когда капитал или результаты стресс-теста слабы.","lens":"Возврат капитала сигналит о силе; вынужденное урезание выплат кричит о слабости."},"71":{"concept":"Клиринг и расчёты","explain":"Клиринг — это согласование того, кто кому и сколько должен; расчёт — фактический перевод средств. Платёж, который вы «отправляете» мгновенно, может пройти клиринг за секунды, а расчёт занять часы или дни.","lens":"Между кликом и расчётом сидят реальный риск — и реальный флоат."},"72":{"concept":"Корреспондентские отношения","explain":"Банки держат счета друг у друга, чтобы двигать деньги через границы и валюты. Ностро — «наш» счёт у них; лоро (востро) — «ваш» счёт у нас. Это костяк трансграничных платежей.","lens":"Эта сеть медленна и дорога — именно на неё нацелены финтех и стейблкоины."},"73":{"concept":"Карты: эмиссия, эквайринг, интерчейндж","explain":"Эмитенты выдают карты держателям; эквайеры подключают торговцев; интерчейндж — устанавливаемая платёжной системой комиссия, которая на каждой операции течёт от эквайера к эмитенту. Это многосторонняя денежная машина.","lens":"Интерчейндж — тихий, огромный и жёстко регулируемый источник прибыли."},"74":{"concept":"Мгновенные платежи в реальном времени","explain":"Системы вроде FedNow, UPI и SEPA Instant проводят клиринг и расчёт за секунды, круглосуточно. Они сжимают флоат, ускоряют мошенничество и давят на комиссии старых платёжных рельсов.","lens":"Платежи в реальном времени убирают флоат — статья дохода и окно риска исчезают разом."},"75":{"concept":"SWIFT и трансграничные платежи","explain":"SWIFT — сеть обмена сообщениями, которой банки передают инструкции по трансграничным платежам: она двигает сообщения, а не деньги. Медленную, многослойную и дорогую, её трение и стремятся убрать финтех и CBDC.","lens":"SWIFT — это сообщения, а не деньги: это различие объясняет большую часть трансграничной боли."},"76":{"concept":"RTGS и деньги центрального банка","explain":"Системы валовых расчётов в реальном времени (RTGS) проводят крупные платежи поштучно и безотзывно в деньгах центрального банка — предельно безрисковом расчётном активе — и составляют ядро национальных платёжных систем.","lens":"Деньги центрального банка — единственный по-настоящему окончательный расчёт; всё прочее лишь обещание."},"77":{"concept":"AML, KYC и мошенничество","explain":"Правила KYC («знай своего клиента») и AML (противодействие отмыванию) требуют от банков проверять личность и отслеживать незаконные потоки. Сбои влекут огромные штрафы и репутационный ущерб.","lens":"Комплаенс — не издержки: один провал по AML может стоить миллиардов и банковской лицензии."},"78":{"concept":"Сверка и бэк-офис","explain":"Неброская работа по сопоставлению записей, чтобы каждая транзакция сходилась. Расхождения здесь сигналят о мошенничестве, ошибке или убытке; сильные операции — это подлинное конкурентное преимущество.","lens":"Операционное совершенство редко попадает в заголовки, но постоянно предотвращает убытки."},"79":{"concept":"Флоат и расчётный риск","explain":"Флоат — деньги в пути, которыми не может пользоваться ни одна сторона; расчётный риск (Херштатт) — это когда одна сторона платит, а другая не завершает расчёт. Разрывы во времени — реальный, исторический источник убытков.","lens":"Разрыв между «заплатил» и «получил» — там, где банкротство контрагента становится вашим убытком."},"80":{"concept":"Отношение расходов к доходам (CIR)","explain":"Операционные расходы ÷ доходы — эталон эффективности. Ниже ~50% — сильно; выше ~65% сигналит о раздутости. Именно на этот рычаг сильнее всего давят технологии и масштаб.","lens":"CIR — метрика, по которой активисты и советы директоров судят о хватке менеджмента."},"81":{"concept":"Инвестиционный и коммерческий банкинг","explain":"Коммерческие банки привлекают депозиты и кредитуют; инвестиционные банки консультируют, организуют размещения и торгуют для корпораций и институтов. Универсальные банки делают и то и другое под одной крышей, с барьерами между направлениями.","lens":"Их сочетание объединяет стабильность фондирования и апсайд комиссий — а вместе с ним и их риски."},"82":{"concept":"Рынки капитала: долг и акции","explain":"Вместо кредитования банки помогают клиентам привлекать деньги напрямую у инвесторов — выпуская облигации (долг) или акции (капитал, IPO). Банк зарабатывает комиссии, беря на баланс мало риска.","lens":"Комиссии рынков капитала ценятся: высокая маржа, лёгкость по капиталу и цикличность."},"83":{"concept":"Секьюритизация","explain":"Объединение кредитов — ипотеки, карт, автозаймов — в пул и продажа их как обращающихся ценных бумаг, выводя риск с баланса и высвобождая капитал для нового кредитования. Использованная неправильно, она подпитала кризис 2008 года.","lens":"Мощный инструмент капитала, который становится оружием, когда качество базовых активов скрыто."},"84":{"concept":"Управление благосостоянием и активами","explain":"Управление деньгами частных лиц (wealth) и институтов (asset management) за регулярные комиссии. Лёгкий по капиталу, липкий и масштабируемый — сегмент, которого банки жаждут больше всего.","lens":"Комиссии от активов под управлением (AUM) — та рента, которой каждый CEO банка хочет больше."},"85":{"concept":"Торговое финансирование","explain":"Финансирование и снижение рисков глобальной торговли — аккредитивы, гарантии, финансирование цепочек поставок — чтобы экспортёры и импортёры могли доверять друг другу. Древнее, необходимое и богатое комиссиями.","lens":"Торговое финансирование смазывает мировую торговлю и привязывает клиентов липким бизнесом с малыми потерями."},"86":{"concept":"Казначейские и валютные услуги","explain":"Помощь клиентам в управлении валютой, ставками и ликвидностью — конвертация валют, хеджирование, кэш-менеджмент. Это высокообъёмная, регулярная выручка, закрепляющая отношения.","lens":"Эти услуги углубляют отношения с клиентом и дают стабильные низкорисковые комиссии."},"87":{"concept":"Основы деривативов","explain":"Контракты, чья стоимость производна от базового актива — ставки, валюты, товара, акции. Форварды фиксируют цену, опционы дают право, свопы обменивают денежные потоки. Инструменты для хеджа или для спекуляции.","lens":"Деривативы передают риск — опасность в том, что не знаешь, у кого он в итоге окажется."},"88":{"concept":"Трейдинг и маркет-мейкинг","explain":"Банки котируют цены покупки и продажи, зарабатывая на спреде bid-ask и предоставляя ликвидность. Это прибыльно, но волатильно и капиталоёмко; правила после 2008 года ограничили собственные торговые риски.","lens":"Торговый доход приукрашивает хорошие годы и способен взорвать плохие."},"89":{"concept":"Универсальные и специализированные банки","explain":"Универсальные банки охватывают розницу, корпоративный бизнес, инвестбанкинг и рынки; специалисты фокусируются — карточный эмитент, частный банк. Широта диверсифицирует выручку, но добавляет сложность и системный риск.","lens":"Диверсификация против фокуса — вечный спор о стратегии и оценке."},"90":{"concept":"Диверсификация комиссионного дохода","explain":"Распределение выручки между кредитованием и несколькими комиссионными потоками, чтобы прибыль пережила любой отдельный шок или ставочный цикл. Инвесторы платят больше за диверсифицированный, регулярный доход.","lens":"Рынок вознаграждает устойчивый комиссионный доход более высоким мультипликатором, чем волатильный процентный спред."},"91":{"concept":"Что определяет оценку банка","explain":"Банки торгуются по мультипликатору «цена/капитал» (P/B) — привязанному к ROE относительно стоимости капитала — больше, чем по P/E. Если ROE превышает COE, акция стоит выше капитала; если нет — ниже. Рост, риск и доходность задают мультипликатор.","lens":"Вся история акций сводится к одному: бьёт ли ваш ROE вашу стоимость капитала?"},"92":{"concept":"Стоимость капитала и правило ROE > COE","explain":"Стоимость собственного капитала (COE) — доходность, которую акционеры требуют за принимаемый риск. Банк создаёт стоимость только когда ROE превышает COE; зарабатывая ниже неё, он разрушает стоимость, даже показывая прибыль.","lens":"«Прибыльный» и «разрушающий стоимость» — не противоположности: банк может быть тем и другим одновременно."},"93":{"concept":"Экономическая прибыль / EVA","explain":"Прибыль после списания платы за весь задействованный капитал, включая собственный по его стоимости. Она обнажает, действительно ли бизнес добавляет стоимость или лишь потребляет дорогой капитал, создавая видимость деятельности.","lens":"Бухгалтерская прибыль приукрашивает; экономическая прибыль говорит правду о стоимости."},"94":{"concept":"Рычаг эффективности","explain":"Снижение отношения расходов к доходам — через автоматизацию, масштаб и упрощение — почти напрямую перетекает в чистую прибыль и ROE. Это самый управляемый рычаг стоимости в руках менеджмента.","lens":"Когда выручку растить трудно, эффективность — тот рычаг, который CEO реально может нажать."},"95":{"concept":"Цифровизация и финтех-разрушение","explain":"Финтех и бигтех атакуют прибыльные, лёгкие по капиталу куски — платежи, кредитование, консультирование — лучшим UX и меньшими издержками, разбирая банк на части. Старожилы защищаются доверием, масштабом, депозитами и лицензиями.","lens":"Угроза не в одном сопернике — это тысяча порезов по вашим лучшим маржам."},"96":{"concept":"Юнит-экономика клиента","explain":"Стоимость на клиента = пожизненная ценность (продукты × маржа × срок отношений) минус стоимость привлечения. Реальную прибыльность двигают кросс-продажи и удержание, а не только привлечение.","lens":"Война выигрывается на кросс-продажах и удержании, а не на ярких цифрах привлечения."},"97":{"concept":"Регуляторный и репутационный риск","explain":"Помимо финансового риска, штрафы, потеря лицензии и репутационный ущерб могут затмить любой отдельный кредитный убыток. В бизнесе, построенном на доверии, репутация — это капитал, и она накапливается в обе стороны.","lens":"В банкинге доверие — это баланс, который не отстроить заново за одну ночь."},"98":{"concept":"Капитал как дефицитный ресурс","explain":"Капитал ограничивает, сколько банк может кредитовать и расти, поэтому его распределение в пользу наивысшей доходности с учётом риска — ключевое стратегическое действие. Каждый бизнес конкурирует за один и тот же дефицитный капитал.","lens":"Подлинная работа CEO — решать, где каждая единица капитала заработает больше всего."},"99":{"concept":"Компромисс роста, риска и доходности","explain":"Можно гнаться за ростом, безопасностью или доходностью — редко за всеми тремя сразу. Быстрый рост часто означает ослабление кредитных стандартов; высокая доходность часто означает больше риска. Управление этим напряжением и есть стратегия.","lens":"Опасайтесь банка, растущего быстрее всех: обычно кто-то занижает цену риска, чтобы так расти."},"100":{"concept":"Табло показателей для CEO","explain":"Метрики, по которым по-настоящему судят о CEO банка: ROE против COE, капитал CET1, отношение расходов к доходам, NIM, качество активов и совокупная доходность акционеров — всё сбалансированное против риска. Всё сводится к ним.","lens":"Управляй банком ради этих цифр — и цена акции последует; гонись за одной ценой — и они тебя предадут."}}},"km":{"modules":{"Interest & Money":"ការប្រាក់ និងលុយ","The Bank Model":"គំរូអាជីវកម្មធនាគារ","Balance Sheet":"តារាងតុល្យការ","Lending & Credit":"ការផ្តល់ប្រាក់កម្ចី និងឥណទាន","Risk":"ហានិភ័យ","Capital & Rules":"ដើមទុន និងបទប្បញ្ញត្តិ","Treasury & ALM":" រតនាគារ និងការគ្រប់គ្រងទ្រព្យសកម្ម-បំណុល (ALM)","Payments & Ops":"ការទូទាត់ និងប្រតិបត្តិការ","Markets & Fees":"ទីផ្សារ និងកម្រៃសេវា","Strategy & Value":"យុទ្ធសាស្ត្រ និងតម្លៃ"},"ui":{"tagline1":"របៀបដែលធនាគារដំណើរការ","tagline2":"កាត ១០០ សន្លឹក ឆ្ពោះទៅកម្រិតថ្នាក់ដឹកនាំ (C-suite)","cardLabel":"កាត","masteredLabel":"បានស្ទាត់ជំនាញ","all":"ទាំងអស់","reveal":"បង្ហាញព័ត៌មានលម្អិត","masteredFlag":"បានស្ទាត់ជំនាញ","lensLabel":"ទស្សនៈថ្នាក់ដឹកនាំ (C-Suite)","flip":"ត្រឡប់","master":"ស្ទាត់ជំនាញ","shuffle":"ច្របល់","kbNav":"រុករក","kbFlip":"ត្រឡប់","kbMaster":"ស្ទាត់ជំនាញ","kbShuffle":"ច្របល់","cardAria":"កាតរៀន។ ចុចដើម្បីបង្ហាញចម្លើយ។","prevAria":"កាតមុន","nextAria":"កាតបន្ទាប់","flipAria":"ត្រឡប់កាត","markAria":"សម្គាល់ថាបានស្ទាត់ជំនាញ","shuffleAria":"ច្របល់សំណុំកាត"},"cards":{"1":{"concept":"របៀបដែលការប្រាក់កើតឡើង","explain":"ការប្រាក់គឺជាតម្លៃនៃពេលវេលា។ ១ ដុល្លារនៅថ្ងៃនេះមានតម្លៃច្រើនជាង ១ ដុល្លារនៅថ្ងៃស្អែក ព្រោះវាអាចយកទៅរកផលបាន ហើយថ្ងៃស្អែកមានហានិភ័យ និងអតិផរណា។ ការប្រាក់គឺជាអ្វីដែលអ្នកឱ្យខ្ចីគិតយក ដើម្បីទូទាត់ការបោះបង់តម្លៃពេលវេលា ដើម្បីទូទាត់អតិផរណាដែលរំពឹងទុក និងដើម្បីទូទាត់ហានិភ័យដែលប្រាក់មិនត្រូវបានសង។","lens":"គ្រប់ផលិតផលដែលធនាគារលក់ ជាមូលដ្ឋានគឺជាការជួលពេលវេលា និងហានិភ័យ។"},"2":{"concept":"ការប្រាក់ធម្មតា ធៀបនឹងការប្រាក់សមាសធាតុ","explain":"ការប្រាក់ធម្មតាគិតតែលើប្រាក់ដើមដំបូងប៉ុណ្ណោះ។ ការប្រាក់សមាសធាតុ (compound) គិតលើប្រាក់ដើមបូកនឹងការប្រាក់ដែលកកកុញទាំងអស់ ដូច្នេះវាកើនឡើងជាបែបស្វ័យគុណ មិនមែនជាបន្ទាត់ត្រង់ទេ។ ក្នុងរយៈពេលវែង ការគិតការប្រាក់សមាសធាតុមានឥទ្ធិពលលើសគេ ដែលជាមូលហេតុថាហេតុអ្វីភាពញឹកញាប់នៃការគិតសមាសធាតុ និងពេលវេលា មានសារៈសំខាន់ជាងអត្រាដែលបានប្រកាស។","lens":"ភាពខុសគ្នាតិចតួចនៃអត្រា ឬកម្រៃ គិតជាសមាសធាតុទៅជាតម្លៃដ៏ធំសម្បើមពេញមួយអាយុកាលនៃឥណទាន។"},"3":{"concept":"អត្រានាមមាត្រ ធៀបនឹងអត្រាពិត","explain":"អត្រានាមមាត្រ (nominal) គឺជាអត្រាដែលបានប្រកាស។ អត្រាពិត (real) បានដកអតិផរណាចេញ (ពិត ≈ នាមមាត្រ − អតិផរណា — ទំនាក់ទំនង Fisher)។ ប្រាក់កម្ចី ៦% ខណៈអតិផរណា ៥% ទទួលបានតែ ~១% នៃអំណាចទិញពិតប្រាកដប៉ុណ្ណោះ។","lens":"រំលៃដែលមើលទៅមាំមួនតាមនាមមាត្រ អាចស្តើង ឬអវិជ្ជមាន បើគិតជាតម្លៃពិត។"},"4":{"concept":"APR ធៀបនឹង APY (ទិន្នផលមានប្រសិទ្ធភាព)","explain":"APR គឺជាអត្រាប្រចាំឆ្នាំធម្មតា ដែលមិនគិតបញ្ចូលការគិតសមាសធាតុក្នុងឆ្នាំ។ APY (ឬ EAR) បញ្ចូលការគិតសមាសធាតុ ដូច្នេះវាតែងតែ ≥ APR។ ១២% គិតសមាសធាតុប្រចាំខែ ពិតជា ~១២.៦៨%។ ច្បាប់បើកបង្ហាញព័ត៌មានកំណត់ថាតម្លៃមួយណាដែលត្រូវបង្ហាញអតិថិជន។","lens":"របៀបដែលអ្នកដកស្រង់អត្រា ផ្លាស់ប្តូរលេខដែលអតិថិជនឃើញ — និងអ្វីដែលអ្នករកបានពិតប្រាកដ។"},"5":{"concept":"តម្លៃបច្ចុប្បន្ន និងការបញ្ចុះតម្លៃ","explain":"តម្លៃបច្ចុប្បន្ន (Present value) បម្លែងលុយអនាគតទៅជាលុយថ្ងៃនេះ ដោយចែកនឹង (1+r)ᵗ — ជាកត្តាបញ្ចុះតម្លៃ។ វាជាម៉ាស៊ីនចលករនៅពីក្រោយការកំណត់តម្លៃឥណទាន ការវាយតម្លៃមូលបត្របំណុល និងគ្រប់សំណួរថា 'លំហូរអនាគតនេះមានតម្លៃប៉ុន្មាននៅឥឡូវនេះ?'","lens":"ការបញ្ចុះតម្លៃ គឺជារបៀបដែលធនាគារកំណត់តម្លៃលើអ្វីៗដែលផ្តល់ផលតាមពេលវេលា។"},"6":{"concept":"អត្រាគ្មានហានិភ័យ","explain":"គឺជាទិន្នផលទ្រឹស្តីនៃការវិនិយោគដែលគ្មានហានិភ័យខកខាន តំណាងដោយបំណុលរដ្ឋាភិបាលរយៈពេលខ្លី ដូចជា Treasury bills។ វាជាកម្រិតទាបបំផុតដែលអត្រាផ្សេងទៀតទាំងអស់ត្រូវបានស្ថាបនាឡើង៖ អត្រាមានហានិភ័យ = អត្រាគ្មានហានិភ័យ + រំលៃសម្រាប់ឥណទាន សាច់ប្រាក់ងាយស្រួល និងរយៈពេល។","lens":"នៅពេលអត្រាគ្មានហានិភ័យផ្លាស់ប្តូរ គ្រប់ទ្រព្យសកម្មទាំងអស់នៅលើតារាងតុល្យការត្រូវកំណត់តម្លៃឡើងវិញ។"},"7":{"concept":"អតិផរណា និងអំណាចទិញ","explain":"អតិផរណាបំផ្លាញនូវអ្វីដែលលុយអាចទិញបានតាមពេលវេលា។ ធនាគាររងផលពីរដង៖ វាស៊ីតម្លៃពិតនៃប្រាក់កម្ចីអត្រាថេរដែលពួកគេកាន់កាប់ ហើយវាជំរុញការសម្រេចចិត្តអំពីអត្រាធនាគារកណ្តាល ដែលកំណត់ថ្លៃដើមមូលនិធិរបស់ពួកគេឡើងវិញ។","lens":"អតិផរណាផ្ទេរតម្លៃដោយស្ងាត់ៗ រវាងអ្នកខ្ចី និងអ្នកដាក់ប្រាក់បញ្ញើរបស់ធនាគារ។"},"8":{"concept":"ភាពញឹកញាប់នៃការគិតសមាសធាតុ","explain":"កាលណាការប្រាក់គិតសមាសធាតុកាន់តែញឹកញាប់ — ប្រចាំឆ្នាំ បន្ទាប់មកប្រចាំខែ ប្រចាំថ្ងៃ ជាបន្តបន្ទាប់ — ទិន្នផលមានប្រសិទ្ធភាពកាន់តែខ្ពស់សម្រាប់អត្រានាមមាត្រដូចគ្នា។ ការគិតសមាសធាតុជាបន្តបន្ទាប់ (continuous) ប្រើ eʳᵗ ហើយជាមូលដ្ឋាននៃការកំណត់តម្លៃឧបករណ៍និស្សន្ទ។","lens":"ភាពញឹកញាប់គឺជាឧបករណ៍លើក៖ វាផ្លាស់ប្តូរសេដ្ឋកិច្ចពិត ដោយមិនប៉ះអត្រាដែលបានផ្សាយ។"},"9":{"concept":"អត្រាថេរ ធៀបនឹងអត្រាអណ្តែត","explain":"អត្រាថេរ (fixed) ត្រូវបានចាក់សោសម្រាប់រយៈពេលកំណត់។ អត្រាអណ្តែត (floating) កំណត់ឡើងវិញតាមកាលកំណត់ ធៀបនឹងលេខសម្គាល់ (SOFR, EURIBOR) បូកនឹងរំលៃ។ អត្រាថេរផ្ទេរហានិភ័យអត្រាទៅលើអ្នកឱ្យខ្ចី ចំណែកអត្រាអណ្តែតផ្ទេរវាទៅលើអ្នកខ្ចី។","lens":"ល្បាយអត្រាថេរ/អណ្តែតលើឥណទាន សម្រេចថានរណាហូរឈាម នៅពេលអត្រាផ្លាស់ប្តូរ។"},"10":{"concept":"រយៈពេលកំណត់ និងខ្សែកោងទិន្នផល","explain":"ខ្សែកោងទិន្នផល (yield curve) បង្ហាញអត្រាការប្រាក់ធៀបនឹងរយៈពេលកំណត់។ ជាធម្មតាវាឡើងទ្រេត — យូរជាងន័យថាទិន្នផលច្រើនជាងសម្រាប់រយៈពេល និងហានិភ័យអតិផរណា — ចំណែកខ្សែកោងបញ្ច្រាស (រយៈពេលខ្លីខ្ពស់ជាងវែង) តាមប្រវត្តិសាស្ត្របានព្រមានពីវិបត្តិសេដ្ឋកិច្ច។","lens":"ជម្រាលនៃខ្សែកោង គឺជាការព្យាករណ៍អាកាសធាតុសម្រាប់រំលៃធនាគារ ក្នុងមួយបន្ទាត់។"},"11":{"concept":"ខ្ចីរយៈខ្លី ឱ្យខ្ចីរយៈវែង","explain":"ធនាគារទទួលប្រាក់បញ្ញើរយៈខ្លីដែលអាចដកវិញបាន ហើយបម្លែងវាទៅជាប្រាក់កម្ចីរយៈវែងដែលពិបាកបម្លែងជាសាច់ប្រាក់ ដោយចាប់យកភាពខុសគ្នា។ 'ការបម្លែងរយៈពេលកំណត់' នេះ គឺជាសេវាសំខាន់ដែលធនាគារផ្តល់ — ព្រមទាំងភាពផុយស្រួយសំខាន់របស់ពួកគេ។","lens":"អាជីវកម្មនេះគឺជាការភ្នាល់ថា មិនមែនមនុស្សគ្រប់គ្នាសុំប្រាក់វិញក្នុងពេលតែមួយនោះទេ។"},"12":{"concept":"រំលៃការប្រាក់សុទ្ធ (NIM)","explain":"NIM = (ការប្រាក់ដែលរកបាន − ការប្រាក់ដែលបង់) ÷ ទ្រព្យសកម្មរកការប្រាក់ជាមធ្យម ជាធម្មតា ១.៥–៤%។ វាជាឧបករណ៍វាស់ចម្បងនៃប្រាក់ចំណេញរបស់ម៉ាស៊ីនផ្តល់ឥណទាន ហើយវាធំឡើងនៅពេលទិន្នផលទ្រព្យសកម្មកើនលឿនជាងថ្លៃដើមមូលនិធិ។","lens":"NIM ខុសគ្នាបន្តិចបន្តួច (basis points) លើឥណទានរាប់ពាន់ពាន់លានដុល្លារ គឺជាលុយពិតប្រាកដ។"},"13":{"concept":"ចំណូលការប្រាក់ ធៀបនឹងចំណូលមិនមែនការប្រាក់","explain":"ចំណូលការប្រាក់សុទ្ធកើតចេញពីរំលៃឥណទាន។ ចំណូលមិនមែនការប្រាក់មកពីកម្រៃ កម្រៃជើងសារ ការជួញដូរ និងសេវាកម្ម។ ល្បាយនេះកំណត់ថាតើប្រាក់ចំណេញរសើបនឹងអត្រាកម្រិតណា — និងបានធ្វើពិពិធកម្មកម្រិតណា។","lens":"ក្រុមប្រឹក្សាភិបាលឱ្យតម្លៃខ្ពស់ដល់ចំណូលកម្រៃ ព្រោះវានៅតែផ្តល់ចំណេញ នៅពេលអត្រាបង្ខាំងរំលៃ។"},"14":{"concept":"ចំណូលកម្រៃ និងកម្រៃជើងសារ","explain":"លុយដែលរកបានពីសេវាកម្ម ជាជាងពីការឱ្យខ្ចី៖ កម្រៃគណនី និងកាត ការប្រឹក្សា ការគ្រប់គ្រងទ្រព្យសកម្ម និងកម្រៃប្រតិបត្តិការ។ វាប្រើដើមទុនតិច និងស្អិតជាប់ ដូច្នេះទីផ្សារឱ្យតម្លៃវិនិយោគខ្ពស់ជាង។","lens":"អាជីវកម្មកម្រៃ បម្លែងអ្នកឱ្យខ្ចីតាមតារាងតុល្យការ ទៅជាអាជីវកម្មសេវាកម្ម។"},"15":{"concept":"អន្តរការីហិរញ្ញវត្ថុ","explain":"ធនាគារឋិតនៅចន្លោះអ្នកសន្សំ និងអ្នកខ្ចី ដោះស្រាយភាពមិនត្រូវគ្នាខាងទំហំ រយៈពេលកំណត់ និងចំណង់ចង់បានហានិភ័យ ព្រមទាំងពិនិត្យ និងតាមដានអ្នកខ្ចីដែលអ្នកសន្សំមិនអាចធ្វើបាន។ ការធ្វើអន្តរការីនោះ គឺជាតម្លៃដែលពួកគេបន្ថែម។","lens":"ការកាត់អន្តរការី — ហ្វីនថេក ទីផ្សារមូលធន stablecoin — វាយប្រហារយ៉ាងជាក់លាក់លើកន្លែងកណ្តាលនេះ។"},"16":{"concept":"រំលៃ (Spread)","explain":"គឺជាគម្លាតរវាងអ្វីដែលធនាគាររកបានលើទ្រព្យសកម្ម និងអ្វីដែលបង់លើបំណុល។ ស្ទើរតែអ្វីៗទាំងអស់ក្នុងធនាគារ ត្រូវបានរៀបចំដើម្បីពង្រីករំលៃនេះ ការពារវា ឬកំណត់តម្លៃហានិភ័យបញ្ចូលទៅក្នុងវាឱ្យបានត្រឹមត្រូវ។","lens":"ពង្រីកឥណទាន ការពាររំលៃ គ្រប់គ្រងការខាតបង់ — ល្បែងទាំងមូលក្នុងឃ្លាមួយ។"},"17":{"concept":"ទុនបម្រុងផ្នែក និងការបង្កើតលុយ","explain":"ធនាគារកាន់តែប្រាក់បញ្ញើមួយផ្នែកតូចជាទុនបម្រុង ហើយឱ្យខ្ចីនៅសល់។ ប្រាក់កម្ចីនីមួយៗក្លាយជាប្រាក់បញ្ញើថ្មីនៅកន្លែងផ្សេង ដែលត្រូវបានឱ្យខ្ចីម្តងទៀត។ ជារួម ប្រព័ន្ធធនាគារបង្កើតលុយតាមរយៈការឱ្យខ្ចី ដែលកំណត់ព្រំដោយដើមទុន និងទុនបម្រុង។","lens":"ធនាគារមិនត្រឹមតែផ្លាស់ទីលុយទេ — ជារួម ពួកគេផលិតវា។"},"18":{"concept":"ប្រាក់បញ្ញើជាមូលនិធិ","explain":"ប្រាក់បញ្ញើអតិថិជនគឺជាមូលនិធិដែលថោកបំផុត និងស្អិតជាប់បំផុតរបស់ធនាគារ — ជាញឹកញាប់ថ្លៃដើមស្ទើរតែសូន្យ និងចេញយឺត។ គុណភាពនៃមូលដ្ឋានប្រាក់បញ្ញើ គឺជាទីតាំងការពារប្រកួតប្រជែងដ៏រឹងមាំបំផុតមួយក្នុងវិស័យធនាគារ។","lens":"ប្រាក់បញ្ញើថោក និងស្មោះត្រង់ គឺជាគ្រឿងអលង្ការមកុដ។ ការបាត់បង់វា បង្កើនថ្លៃដើមនៃអ្វីៗទាំងអស់។"},"19":{"concept":"មូលនិធិលក់ដុំ ធៀបនឹងលក់រាយ","explain":"មូលនិធិលក់រាយ គឺជាប្រាក់បញ្ញើតូចៗច្រើន និងស្អិតជាប់។ មូលនិធិលក់ដុំ គឺជាប្រាក់ចំនួនធំ រសើបនឹងអត្រា ពីទីផ្សារ និងស្ថាប័ន ដែលអាចរត់ចេញយ៉ាងលឿន។ ការពឹងផ្អែកលើមូលនិធិលក់ដុំហួសហេតុ គឺជាចំណុចស្នូលនៃការដួលរលំឆ្នាំ ២០០៨។","lens":"ល្បាយមូលនិធិ គឺជាសំណួរនៃការរស់រាន មិនមែនគ្រាន់តែជាសំណួរថ្លៃដើមទេ។"},"20":{"concept":"ថ្លៃដើមមូលនិធិ","explain":"គឺជាអត្រាលាយបញ្ចូលគ្នាដែលធនាគារបង់លើមូលនិធិទាំងអស់ — ប្រាក់បញ្ញើ បំណុល លក់ដុំ។ វាកំណត់កម្រិតទាបបំផុតនៃការកំណត់តម្លៃឥណទាន៖ ឱ្យខ្ចីទាបជាងថ្លៃដើមមូលនិធិបូកចំណាយបូកការខាតបង់ដែលរំពឹងទុក នោះអ្នកខាតលុយ។","lens":"អ្នកមិនអាចរីកលូតលាស់លើសពីថ្លៃដើមមូលនិធិដែលខូចនោះទេ។"},"21":{"concept":"ការអានតារាងតុល្យការធនាគារ","explain":"សម្រាប់ធនាគារ តារាងតុល្យការត្រូវបានបញ្ច្រាសពីក្រុមហ៊ុនធម្មតា៖ ប្រាក់កម្ចីជាទ្រព្យសកម្ម (លុយដែលគេជំពាក់វា) ប្រាក់បញ្ញើជាបំណុល (លុយដែលវាជំពាក់គេ)។ មូលធនគឺជាបន្ទះស្តើងនៅចន្លោះ ដែលស្រូបយកការខាតបង់។","lens":"ធនាគារ គឺជាតារាងតុល្យការរបស់វា — របាយការណ៍ចំណេញ-ខាត គ្រាន់តែជាអ្វីដែលតារាងតុល្យការនោះរកបាន។"},"22":{"concept":"ទ្រព្យសកម្ម និងបំណុល ដែលឆ្លុះគ្នា","explain":"ប្រាក់បញ្ញើរបស់អ្នកគឺជាទ្រព្យសកម្មរបស់អ្នក ប៉ុន្តែជាបំណុលរបស់ធនាគារ។ ប្រាក់កម្ចីរបស់អ្នកគឺជាទ្រព្យសកម្មរបស់ធនាគារ ប៉ុន្តែជាបំណុលរបស់អ្នក។ ការយល់ពីកញ្ចក់ឆ្លុះនេះ គឺជាកូនសោនៃការអានគណនីធនាគារណាមួយ។","lens":"ទ្រព្យសកម្មរបស់ភាគីម្ខាង តែងតែជាបំណុលរបស់ភាគីម្ខាងទៀត — ធនាគារធ្វើឱ្យការពិតនោះទៅជាឧស្សាហកម្ម។"},"23":{"concept":"មូលធន / ដើមទុន","explain":"គឺជាមូលនិធិម្ចាស់ភាគហ៊ុន៖ ទ្រព្យសកម្មដកបំណុល។ វាជាឆ្នុកស្រូបយកការខាតបង់មុនពេលប៉ះពាល់អ្នកដាក់ប្រាក់បញ្ញើ ហើយជាមូលដ្ឋានសម្រាប់វាស់ទិន្នផល (ROE) — ជាធម្មតាមានតែ ៥–១០% នៃតារាងតុល្យការប៉ុណ្ណោះ។","lens":"ដើមទុនគឺជាទាំងឆ្នុកស្រូបយកការឆក់ ព្រមទាំងជាភាគបែងនៃប័ណ្ណពិន្ទុ។"},"24":{"concept":"សមាសភាពនៃឥណទាន","explain":"គឺជាល្បាយនៃផ្នែកទ្រព្យសកម្ម — កម្ចីទិញផ្ទះ កម្ចីសាជីវកម្ម ឥណទានអ្នកប្រើប្រាស់ កាត — ចែកតាមវិស័យ និងភូមិសាស្ត្រ។ ការប្រមូលផ្តុំ និងគុណភាពរបស់វា ជំរុញទាំងទិន្នផលដែលរកបាន និងការខាតបង់ដែលទទួលរង។","lens":"បង្ហាញខ្ញុំពីការប្រមូលផ្តុំនៃឥណទាន នោះខ្ញុំនឹងបង្ហាញអ្នកពីកន្លែងដែលវិបត្តិបន្ទាប់នឹងធ្លាក់ចុះ។"},"25":{"concept":"ធាតុក្រៅតារាងតុល្យការ","explain":"គឺជាការប្តេជ្ញាចិត្ត និងការប៉ះពាល់ដែលមិន (នៅឡើយ) នៅលើតារាងតុល្យការ៖ វិស័យឥណទានមិនទាន់ដក ការធានា លិខិតឥណទាន និស្សន្ទ។ ពួកវាមានហានិភ័យពិតប្រាកដ ហើយអាចធ្លាក់មកលើតារាងតុល្យការក្នុងវិបត្តិ។","lens":"អ្វីដែលនៅក្រៅតារាងតុល្យការ បានបញ្ចប់ធនាគារច្រើនជាងអ្វីដែលនៅលើវាទៅទៀត។"},"26":{"concept":"របាយការណ៍លទ្ធផល","explain":"បន្ទាត់កំពូលគឺចំណូលការប្រាក់សុទ្ធ បូកចំណូលកម្រៃ បូកចំណូលពីការជួញដូរ។ ដកចំណាយប្រតិបត្តិការ និងសំវិធានធនការខាតបង់ឥណទាន ដើម្បីទៅដល់ប្រាក់ចំណេញមុនបង់ពន្ធ។ សំវិធានធនគឺជាកត្តាប្រែប្រួល ដែលបម្លែងឆ្នាំល្អទៅជាឆ្នាំអាក្រក់។","lens":"ចំណូលត្រូវបានជ្រើសរើស ចំណែកសំវិធានធនត្រូវបានបង្ហាញ — នោះជាកន្លែងដែលការពិតលាក់ខ្លួន។"},"27":{"concept":"ទិន្នផលលើទ្រព្យសកម្ម (ROA)","explain":"ចំណេញសុទ្ធ ÷ ទ្រព្យសកម្មសរុប — គឺជារបៀបដែលតារាងតុល្យការទាំងមូលបង្កើតប្រាក់ចំណេញប្រកបដោយប្រសិទ្ធភាព។ ប្រហែល ១% គឺរឹងមាំសម្រាប់ធនាគារ។ ROA ទាបគឺជាលក្ខណៈពិសេស ហើយធនាគារបំពេញវាដោយបរិមាណ និងឥណពន្ធ។","lens":"ROA ស្តើងគឺជារឿងធម្មតា។ ឥណពន្ធ (leverage) ដែលដាក់ពីលើ គឺជាអ្វីដែលបង្កើតទិន្នផលមូលធន។"},"28":{"concept":"ទិន្នផលលើមូលធន (ROE)","explain":"ចំណេញសុទ្ធ ÷ មូលធនម្ចាស់ភាគហ៊ុន — ជាឧបករណ៍វាស់ប្រាក់ចំណេញចម្បង។ ROE ≈ ROA × ឥណពន្ធ ដូច្នេះ ROA ១% ដែលមានឥណពន្ធ ១០× ផ្តល់ ROE ១០%។","lens":"ROE បង្កើតតម្លៃ តែនៅពេលវាលើសពីថ្លៃដើមមូលធន — លេខដែលគ្រប់គ្រងថ្នាក់ដឹកនាំ។"},"29":{"concept":"ឥណពន្ធ (Leverage)","explain":"ធនាគារផ្តល់មូលនិធិទ្រព្យសកម្មភាគច្រើនដោយបំណុល និងប្រាក់បញ្ញើ មិនមែនមូលធនទេ ដូច្នេះទ្រព្យសកម្មអាចមាន ១០–២០× នៃមូលធន។ ឥណពន្ធពង្រីក ROE — និងការខាតបង់៖ ការខាតទ្រព្យសកម្ម ៥% នៅឥណពន្ធ ១៥× លុបបំបាត់មូលធនចោល។","lens":"ឥណពន្ធ គឺជាឧបករណ៍ពង្រីក — វាធ្វើឱ្យគ្រាល្អកាន់តែល្អ និងគ្រាអាក្រក់កាន់តែស្លាប់។"},"30":{"concept":"តម្លៃតាមបញ្ជី ធៀបនឹងតម្លៃទីផ្សារ","explain":"តម្លៃតាមបញ្ជី (book value) គឺជាមូលធនតាមគណនេយ្យ។ តម្លៃទីផ្សារគឺជាអ្វីដែលវិនិយោគិននឹងបង់។ អត្រាតម្លៃធៀបនឹងតម្លៃតាមបញ្ជី (price-to-book) លើសពី ១ មានន័យថាទីផ្សារជឿថាធនាគាររកបានលើសពីថ្លៃដើមមូលធន។ ក្រោម ១ បង្ហាញការសង្ស័យ។","lens":"Price-to-book ក្រោម ១ គឺជាទីផ្សារកំពុងនិយាយថា ROE របស់អ្នកមិនគ្របដណ្តប់លើហានិភ័យរបស់វាទេ។"},"31":{"concept":"ដំណើរការឥណទាន","explain":"ការវាយតម្លៃ (underwriting)៖ វាយតម្លៃអ្នកខ្ចី រៀបចំរចនាសម្ព័ន្ធកម្ចី កំណត់តម្លៃតាមហានិភ័យ អនុម័តក្នុងព្រំដែនកំណត់ បន្ទាប់មកតាមដានរហូតដល់ផុតកំណត់។ ការបង្កើតឥណទានប្រកបដោយវិន័យ គឺជាទម្រង់ថោកបំផុតនៃការគ្រប់គ្រងហានិភ័យ។","lens":"ការខាតបង់ត្រូវបានបង្កើតឡើងនៅពេលបង្កើតឥណទាន ហើយគ្រាន់តែត្រូវបានទទួលស្គាល់នៅពេលក្រោយ។"},"32":{"concept":"5 Cs នៃឥណទាន","explain":"Character (កំណត់ត្រាប្រវត្តិ), Capacity (លំហូរសាច់ប្រាក់ដើម្បីសង), Capital (ភាគហ៊ុនផ្ទាល់ខ្លួនរបស់អ្នកខ្ចី), Collateral (ទ្រព្យបញ្ចាំបម្រុង), និង Conditions (សេដ្ឋកិច្ច និងគោលបំណង)។ ជាបញ្ជីត្រួតពិនិត្យអមតៈអំពីអ្នកណាដែលគួរឱ្យខ្ចី។","lens":"គំរូ (framework) ចាស់ទៅ ប៉ុន្តែ 5 Cs នៅតែពន្យល់ការខកខានសងភាគច្រើន។"},"33":{"concept":"កម្ចីមានទ្រព្យបញ្ចាំ ធៀបនឹងគ្មានទ្រព្យបញ្ចាំ","explain":"កម្ចីមានទ្រព្យបញ្ចាំ (secured) ត្រូវបានគាំទ្រដោយទ្រព្យបញ្ចាំដែលធនាគារអាចរឹបអូស (កម្ចីទិញផ្ទះ កម្ចីទិញរថយន្ត)។ កម្ចីគ្មានទ្រព្យបញ្ចាំ (unsecured) ពឹងតែលើការសន្យាថានឹងសង (កាត កម្ចីផ្ទាល់ខ្លួន) ដូច្នេះមានអត្រា និងការខាតបង់ខ្ពស់ជាង។","lens":"អវត្តមាននៃទ្រព្យបញ្ចាំ ត្រូវតែកំណត់តម្លៃ — មិនដូច្នេះទេ វាក្លាយជាការខាតបង់។"},"34":{"concept":"ទ្រព្យបញ្ចាំ និងសមាមាត្រកម្ចីធៀបនឹងតម្លៃ (LTV)","explain":"LTV = កម្ចី ÷ តម្លៃទ្រព្យបញ្ចាំ។ កម្ចីទិញផ្ទះ LTV ៨០% ទុកឆ្នុកមូលធន ២០% មុនពេលធនាគារធ្លាក់ក្រោមទឹក។ តម្លៃទ្រព្យបញ្ចាំធ្លាក់ចុះ — វិបត្តិលំនៅដ្ឋាន — បម្លែង LTV ដែលធ្លាប់សុវត្ថិភាព ទៅជាគ្រោះថ្នាក់។","lens":"ទ្រព្យបញ្ចាំល្អ តែត្រឹមតម្លៃរបស់វានៅក្នុងស្ថានភាពតានតឹងជាក់លាក់ដែលអ្នកត្រូវការវាប៉ុណ្ណោះ។"},"35":{"concept":"ហានិភ័យឥណទាន និងប្រូបាប៊ីលីតេនៃការខកខានសង","explain":"ហានិភ័យឥណទានគឺជាឱកាសដែលអ្នកខ្ចីមិនសង។ PD គឺជាប្រូបាប៊ីលីតេប៉ាន់ស្មាននៃការខកខានសង (default) ក្នុងរយៈពេលកំណត់ ជាធម្មតាមួយឆ្នាំ — ជាធាតុចូលដំបូងសម្រាប់កំណត់ទំហំការខាតបង់ដែលរំពឹងទុក។","lens":"PD គឺជាការព្យាករណ៍ ហើយការព្យាករណ៍បរាជ័យ ជាក់លាក់នៅពេលមនុស្សគ្រប់គ្នាខកខានសងជាមួយគ្នា។"},"36":{"concept":"LGD និង EAD","explain":"Loss Given Default (LGD) គឺជាភាគរយដែលមិនអាចប្រមូលវិញបាន បន្ទាប់ពីការខកខានសង បន្ទាប់ពីដកទ្រព្យបញ្ចាំ។ Exposure at Default (EAD) គឺជាចំនួនដែលជំពាក់នៅពេលកើតការខកខានសង។ រួមជាមួយ PD ពួកវាកំណត់ទំហំការខាតបង់។","lens":"ការប្រមូលវិញ (1 − LGD) គឺជាកន្លែងដែលក្រុមដោះស្រាយឥណទានពូកែ រកចំណូលដោយស្ងាត់ៗ។"},"37":{"concept":"ការខាតបង់ដែលរំពឹងទុក (PD × LGD × EAD)","explain":"ការខាតបង់ដែលរំពឹងទុក = ប្រូបាប៊ីលីតេនៃការខកខានសង × ការខាតបង់ពេលខកខានសង × ការប៉ះពាល់ពេលខកខានសង។ វាជាការខាតបង់ជាមធ្យមដែលអ្នកគ្រោងទុក និងកំណត់តម្លៃចូលក្នុងកម្ចី — គ្របដណ្តប់ដោយសំវិធានធន និងរំលៃ មិនមែនដោយដើមទុនទេ។","lens":"ការខាតបង់ដែលរំពឹងទុកគឺជាថ្លៃដើមនៃការធ្វើអាជីវកម្ម។ ការខាតបង់ដែលមិនរំពឹងទុក គឺជាមូលហេតុដែលមានដើមទុន។"},"38":{"concept":"សំវិធានធនការខាតបង់ឥណទាន","explain":"គឺជាទុនបម្រុងដែលទុកសម្រាប់ការខាតបង់ឥណទានដែលរំពឹងទុក។ ច្បាប់ទំនើប — IFRS 9 និង CECL — តម្រូវឱ្យកត់ត្រាការខាតបង់ដែលរំពឹងទុកលើមូលដ្ឋានមើលទៅមុខ ជាជាងរង់ចាំការខកខានសង ដែលធ្វើឱ្យសំវិធានធនប្រែប្រួលច្រើនជាង។","lens":"ពេលវេលានៃការធ្វើសំវិធានធន ផ្លាស់ប្តូរប្រាក់ចំណេញរវាងឆ្នាំ — ត្រូវឃ្លាំមើលវាឱ្យបានហ្មត់ចត់។"},"39":{"concept":"ឥណទានមិនដំណើរការ (NPLs)","explain":"គឺជាកម្ចីដែលអ្នកខ្ចីបានឈប់សង ជាធម្មតាហួសកំណត់ ៩០ថ្ងៃ ឬច្រើនជាង។ សមាមាត្រ NPL គឺជាឧបករណ៍វាស់គុណភាពទ្រព្យសកម្មចម្បង។ NPL កើនឡើងស៊ីដើមទុន និងបញ្ជាក់ពីឥណទានដែលកំពុងធ្លាក់ចុះ។","lens":"និន្នាការ NPL នាំមុខប្រាក់ចំណេញ — វាប្រាប់អ្នកពីសំវិធានធនឆ្នាំក្រោយ តាំងពីថ្ងៃនេះ។"},"40":{"concept":"ការកំណត់តម្លៃឥណទានផ្អែកលើហានិភ័យ","explain":"តម្លៃ = ថ្លៃដើមមូលនិធិ + ចំណាយប្រតិបត្តិការ + ការខាតបង់ដែលរំពឹងទុក + បន្ទុកដើមទុន + រំលៃគោលដៅ។ អ្នកខ្ចីមានហានិភ័យខ្ពស់ត្រូវបង់ច្រើនជាង ដើម្បីគ្របដណ្តប់ការខាតបង់ដែលរំពឹងទុកខ្ពស់ និងការប្រើដើមទុនធ្ងន់ជាង។","lens":"កំណត់តម្លៃហានិភ័យទាបពេក ដើម្បីឈ្នះបរិមាណ នោះអ្នកគ្រាន់តែកំពុងទិញការខាតបង់ក្នុងតម្លៃបញ្ចុះ។"},"41":{"concept":"ប្រភេទហានិភ័យសំខាន់ទាំងបួន","explain":"ឥណទាន (អ្នកខ្ចីមិនសង), ទីផ្សារ (តម្លៃផ្លាស់ប្តូរប្រឆាំងនឹងអ្នក), សាច់ប្រាក់ងាយស្រួល (អ្នកមិនអាចផ្តល់មូលនិធិ ឬទូទាត់), និងប្រតិបត្តិការ (មនុស្ស ពដើម្បីជួញដូរ ដោយកំណត់តម្លៃទីផ្សារ (mark-to-market) ប្រចាំថ្ងៃ។ ពួកវាមានហានិភ័យ ច្បាប់ដើមទុន និងគណនេយ្យខុសគ្នា។","lens":"សៀវភៅដែលទ្រព្យសកម្មស្ថិតនៅ ផ្លាស់ប្តូរដើមទុន គណនេយ្យ និងម្ចាស់ហានិភ័យរបស់វា។"},"63":{"concept":"ការកំណត់តម្លៃផ្ទេរមូលនិធិ (FTP)","explain":"'តម្លៃ' ផ្ទៃក្នុងដែលរតនាគារ (treasury) គិតលើអង្គភាពឱ្យខ្ចីសម្រាប់មូលនិធិ ហើយបង់ឱ្យអង្គភាពប្រមូលប្រាក់បញ្ញើសម្រាប់ការរៃប្រាក់។ វាបែងចែក spread ដោយយុត្តិធម៌ ហើយបង្ហាញថាតើអាជីវកម្មណាបង្កើតតម្លៃពិតប្រាកដ។","lens":"បើ FTP ខុស អ្នកនឹងផ្តល់រង្វាន់ដល់អាជីវកម្មខុស ហើយកំណត់តម្លៃខុសលើសៀវភៅទាំងមូល។"},"64":{"concept":"គម្លាតអត្រាការប្រាក់ និងអំឡុងពេល (Duration)","explain":"ការវិភាគគម្លាត (gap analysis) វាស់ភាពមិនត្រូវគ្នារវាងទ្រព្យសកម្ម និងបំណុលដែលកំណត់តម្លៃឡើងវិញក្នុងអំឡុងពេលមួយ អំឡុងពេល (duration) វាស់ភាពប្រែប្រួលនៃតម្លៃចំពោះការផ្លាស់ប្តូរអត្រា។ ទាំងពីរបរិមាណវាស់ថាការប៉ះទង្គិចអត្រា ប៉ះពាល់ដល់ចំណូល និងតម្លៃយ៉ាងណា។","lens":"គម្លាតធំដែលមិនបានការពារ (unhedged) គឺជាការភ្នាល់ដោយអានុភាព ថាអត្រានឹងទៅទិសណាបន្ទាប់។"},"65":{"concept":"ការការពារហានិភ័យដោយ Swaps","explain":"Swaps អត្រាការប្រាក់ អនុញ្ញាតឱ្យធនាគារបំប្លែងការប៉ះពាល់អត្រាថេរ ទៅជាអណ្តែត (ឬផ្ទុយមកវិញ) ដោយមិនប៉ះពាល់ដល់កម្ចីមូលដ្ឋាន ដោយកម្ចាត់ហានិភ័យអត្រាដោយថោក និងបត់បែន។","lens":"ឧបករណ៍និស្សន្ទ (derivatives) មិនមែនជាហានិភ័យទេ — ការមិនប្រើវាដើម្បីការពារហានិភ័យ ជាញឹកញាប់ទើបជាហានិភ័យ។"},"66":{"concept":"ការគ្រប់គ្រងសន្ទនីយភាព","explain":"ការកាន់ខ្នើយទ្រព្យសកម្មសន្ទនីយភាព និងមូលនិធិចម្រុះ ដើម្បីឱ្យធនាគារអាចបំពេញការហូរចេញក្នុងភាពតានតឹង ដោយមិនចាំបាច់លក់រ៉ាទ់ (fire sale)។ វាត្រូវបានគ្រប់គ្រងប្រចាំថ្ងៃ តាមរយៈការព្យាករលំហូរសាច់ប្រាក់ និងខ្នើយសន្ទនីយភាព។","lens":"សន្ទនីយភាពថោកក្នុងការកាន់ ប៉ុន្តែមានតម្លៃថ្លៃថ្លា ពេលទីផ្សារកក។"},"67":{"concept":"អត្រាគោលនយោបាយ និងការបញ្ជូន (Transmission)","explain":"ធនាគារកណ្តាលកំណត់អត្រាគោលនយោបាយ វាហូរឆ្លងកាត់ទីផ្សារប្រាក់ ចូលទៅក្នុងអត្រាប្រាក់បញ្ញើ និងកម្ចី ហើយដូច្នេះចូលទៅក្នុងរឹមចំណេញរបស់ធនាគារ និងសេដ្ឋកិច្ចទូលំទូលាយ។ ការបញ្ជូននេះគឺជាគោលនយោបាយរូបិយវត្ថុក្នុងសកម្មភាព។","lens":"ពេលធនាគារកណ្តាលផ្លាស់ប្តូរ រតនាគារសម្រេចថាបញ្ជូនបន្តប៉ុន្មានទៅអតិថិជន។"},"68":{"concept":"Repo និងទីផ្សារប្រាក់","explain":"ការខ្ចីមានវត្ថុបញ្ចាំរយៈពេលខ្លី ដែលមូលបត្រត្រូវបានលក់ ហើយទិញត្រឡប់វិញ — ជាបំពង់បង្ហូរ (plumbing) ដែលធនាគារប្រើដើម្បីផ្តល់មូលនិធិដល់ស្ថានភាព និងគ្រប់គ្រងសន្ទនីយភាពប្រចាំថ្ងៃ។ ការកកនៃទីផ្សារ repo គឺជាការជាប់គាំងទូទាំងប្រព័ន្ធ។","lens":"ទីផ្សារ repo មើលមិនឃើញ រហូតដល់វាឈប់ដំណើរការ — ពេលនោះវាក្លាយជារឿងទាំងមូល។"},"69":{"concept":"ការធ្វើផែនការដើមទុន (ICAAP)","explain":"ការវាយតម្លៃ ដោយផ្ទាល់របស់ធនាគារ ដែលមើលទៅមុខ និងឆ្លងកាត់ការធ្វើតេស្តភាពតានតឹង អំពីថាតើហានិភ័យរបស់ខ្លួនត្រូវការដើមទុនប៉ុន្មាន ដែលត្រូវបានពិនិត្យដោយអ្នកគ្រប់គ្រងបទប្បញ្ញត្តិ។ វាភ្ជាប់យុទ្ធសាស្ត្រ ហានិភ័យ និងដើមទុន ក្នុងដំណើរការតែមួយ។","lens":"ICAAP គឺជាកន្លែងដែល 'យើងអាចដំណើរការហានិភ័យបានប៉ុន្មាន' ជួបនឹង 'យើងមានដើមទុនប៉ុន្មាន'។"},"70":{"concept":"ការសងដើមទុនត្រឡប់ និងភាគលាភ","explain":"ការសម្រេចថាតើត្រូវរក្សាទុកចំណេញប៉ុន្មាន — ដើម្បីលូតលាស់ និងធ្វើខ្នើយ — ធៀបនឹងការសងត្រឡប់តាមរយៈភាគលាភ និងការទិញភាគហ៊ុនត្រឡប់ (buyback)។ អ្នកគ្រប់គ្រងបទប្បញ្ញត្តិអាចរារាំងការសងត្រឡប់ ពេលដើមទុន ឬលទ្ធផលតេស្តភាពតានតឹងខ្សោយ។","lens":"ការសងដើមទុនត្រឡប់បង្ហាញភាពរឹងមាំ ការត្រូវបង្ខំឱ្យកាត់បន្ថយវា ស្រែកបង្ហាញភាពខ្សោយ។"},"71":{"concept":"ការសម្រុះសម្រួល (Clearing) និងការទូទាត់ (Settlement)","explain":"Clearing គឺជាការឯកភាពថាអ្នកណាជំពាក់អ្វី ការទូទាត់ (settlement) គឺជាការផ្ទេរមូលនិធិពិតប្រាកដ។ ការទូទាត់ដែលអ្នក 'ផ្ញើ' ភ្លាមៗ អាចត្រូវ clear ក្នុងវិនាទី ប៉ុន្តែ settle ក្នុងម៉ោង ឬថ្ងៃក្រោយ។","lens":"រវាងការចុច និងការទូទាត់ មានហានិភ័យពិតប្រាកដ — និង float ពិតប្រាកដ។"},"72":{"concept":"ធនាគារឆ្លើយឆ្លង (Correspondent banking)","explain":"ធនាគារកាន់គណនីជាមួយគ្នា ដើម្បីផ្ទេរប្រាក់ឆ្លងព្រំដែន និងរូបិយប័ណ្ណ។ Nostro គឺជាគណនី 'របស់យើង' ដែលកាន់នៅឯគេ vostro គឺជាគណនី 'របស់អ្នក' ដែលកាន់នៅឯយើង។ វាជាឆ្អឹងខ្នងនៃការទូទាត់ឆ្លងព្រំដែន។","lens":"បណ្តាញនេះយឺត និងចំណាយថ្លៃ — គឺជាអ្វីដែល fintech និង stablecoins កំពុងតម្រង់ចាំវាយ។"},"73":{"concept":"កាត៖ ការចេញ ការទទួល និង Interchange","explain":"អ្នកចេញ (issuer) ផ្តល់កាតដល់អ្នកប្រើប្រាស់ អ្នកទទួល (acquirer) ចុះឈ្មោះឈ្មួញ interchange គឺជាកម្រៃដែលបណ្តាញកំណត់ ដែលហូរពី acquirer ទៅ issuer លើការរូតកាតម្តងៗ។ វាជាម៉ាស៊ីនរកលុយពហុភាគី។","lens":"Interchange គឺជាអាងចំណេញដ៏ស្ងាត់ ធំ និងត្រូវបានគ្រប់គ្រងបទប្បញ្ញត្តិយ៉ាងខ្លាំង។"},"74":{"concept":"ការទូទាត់ភ្លាមៗ / ពេលវេលាជាក់ស្តែង","explain":"ប្រព័ន្ធដូចជា FedNow, UPI និង SEPA Instant ធ្វើ clear និង settle ក្នុងវិនាទី ២៤/៧។ ពួកវាបង្ហាប់ float បង្កើនល្បឿនការក្លែងបន្លំ (fraud) និងបង្កសម្ពាធលើកម្រៃនៃផ្លូវទូទាត់បុរាណ (legacy rails)។","lens":"ការទូទាត់ពេលវេលាជាក់ស្តែងដកចេញ float — ខ្សែចំណូល និងបង្អួចហានិភ័យ បាត់ទៅជាមួយគ្នា។"},"75":{"concept":"SWIFT និងឆ្លងព្រំដែន","explain":"SWIFT គឺជាបណ្តាញផ្ញើសារ (messaging) ដែលធនាគារប្រើ ដើម្បីណែនាំការទូទាត់ឆ្លងព្រំដែន — វាផ្ទេរសារ មិនមែនប្រាក់។ យឺត មានស្រទាប់ច្រើន និងចំណាយថ្លៃ វាជាកកិត (friction) ដែល fintech និង CBDC តម្រង់ចាំដកចេញ។","lens":"SWIFT គឺជាការផ្ញើសារ មិនមែនប្រាក់ — ការបែងចែកនេះពន្យល់ពីការឈឺចាប់ភាគច្រើននៃការទូទាត់ឆ្លងព្រំដែន។"},"76":{"concept":"RTGS និងប្រាក់ធនាគារកណ្តាល","explain":"ប្រព័ន្ធទូទាត់សរុបពេលវេលាជាក់ស្តែង (RTGS) ទូទាត់ការទូទាត់ធំៗម្តងមួយ និងមិនអាចដកវិញបាន ជាប្រាក់ធនាគារកណ្តាល — ដែលជាទ្រព្យសកម្មទូទាត់គ្មានហានិភ័យ (risk-free) ចុងក្រោយបំផុត — ហើយបង្កើតជាស្នូលនៃប្រព័ន្ធទូទាត់ជាតិ។","lens":"ប្រាក់ធនាគារកណ្តាលគឺជាការទូទាត់ចុងក្រោយ (final) តែមួយគត់ពិតប្រាកដ — អ្វីៗឯទៀតគ្រាន់តែជាការសន្យា។"},"77":{"concept":"AML, KYC និងការក្លែងបន្លំ","explain":"ច្បាប់ ស្គាល់អតិថិជនរបស់អ្នក (KYC) និងប្រឆាំងការសម្អាតប្រាក់ (AML) ទាមទារឱ្យធនាគារផ្ទៀងផ្ទាត់អត្តសញ្ញាណ និងតាមដានលំហូរខុសច្បាប់។ ការបរាជ័យនាំមកនូវការពិន័យដ៏ធំ និងការខូចខាតកេរ្តិ៍ឈ្មោះ។","lens":"ការអនុលោមភាព (compliance) មិនមែនជាចំណាយបន្ថែមទេ — ការបរាជ័យ AML មួយ អាចធ្វើឱ្យខាតរាប់ពាន់លាន និងអាជ្ញាបណ្ណធនាគារ។"},"78":{"concept":"ការផ្ទៀងផ្ទាត់សម្រុង (Reconciliation) និងផ្នែកខាងក្រោយ","explain":"ការងារ ដែលមិនទាក់ទាញ នៃការផ្គូផ្គងកំណត់ត្រា ដើម្បីឱ្យរាល់ប្រតិបត្តិការមានតុល្យភាព។ ភាពមិនចុះសម្រុង (break) នៅទីនេះ បង្ហាញពីការក្លែងបន្លំ កំហុស ឬការខាតបង់ ប្រតិបត្តិការរឹងមាំគឺជាគុណសម្បត្តិប្រកួតប្រជែងពិតប្រាកដ។","lens":"ភាពល្អឥតខ្ចោះនៃប្រតិបត្តិការ កម្រឡើងក្បាលទំព័រព័ត៌មាន ប៉ុន្តែការពារការខាតបង់ជានិច្ច។"},"79":{"concept":"Float និងហានិភ័យទូទាត់","explain":"Float គឺជាប្រាក់ ក្នុងដំណើរផ្ទេរ ដែលភាគីទាំងពីរមិនអាចប្រើ ហានិភ័យទូទាត់ (Herstatt risk) គឺភាគីម្ខាងបានបង់ ហើយម្ខាងទៀតបរាជ័យ មុនពេលបញ្ចប់។ គម្លាតពេលវេលា គឺជាប្រភពប្រវត្តិសាស្ត្រពិតប្រាកដនៃការខាតបង់។","lens":"គម្លាតរវាងការបង់ និងការទទួល គឺជាកន្លែងដែលការបរាជ័យរបស់ដៃគូ ក្លាយជាការខាតបង់របស់អ្នក។"},"80":{"concept":"សមាមាត្រចំណាយ-ទៅ-ចំណូល (Cost-to-income)","explain":"ចំណាយប្រតិបត្តិការ ÷ ចំណូល — គោលដៅប្រៀបធៀបប្រសិទ្ធភាព។ ក្រោម ~50% គឺរឹងមាំ លើស ~65% បង្ហាញភាពរីកធាត់ (bloat)។ វាជាឧបករណ៍ដែលបច្ចេកវិទ្យា និងទំហំ (scale) ចាប់ផ្លាស់ប្តូរដោយផ្ទាល់បំផុត។","lens":"Cost-to-income គឺជាមាត្រដ្ឋានដែលអ្នកសកម្មនិយម (activist) និងក្រុមប្រឹក្សា ប្រើដើម្បីវិនិច្ឆ័យការគ្រប់គ្រងរបស់អ្នកគ្រប់គ្រង។"},"81":{"concept":"ធនាគារវិនិយោគ ធៀបនឹង ធនាគារពាណិជ្ជ","explain":"ធនាគារពាណិជ្ជ (commercial) ទទួលប្រាក់បញ្ញើ និងឱ្យខ្ចី ធនាគារវិនិយោគ (investment) ផ្តល់ប្រឹក្សា ធានាការចេញលក់ (underwrite) និងជួញដូរ សម្រាប់សាជីវកម្ម និងស្ថាប័ន។ ធនាគារសកល (universal) ធ្វើទាំងពីរក្រោមដំបូលតែមួយ ដោយមានជញ្ជាំងខណ្ឌចែករវាងពួកវា។","lens":"ទាំងពីរលាយស្ថេរភាពមូលនិធិ ជាមួយកម្រៃចំណេញខ្ពស់ — ហើយក៏លាយហានិភ័យរបស់ពួកវាផងដែរ។"},"82":{"concept":"ទីផ្សារមូលធន៖ បំណុល និងសមធម៌","explain":"ជំនួសឱ្យការឱ្យខ្ចី ធនាគារជួយអតិថិជនរៃប្រាក់ដោយផ្ទាល់ពីវិនិយោគិន — ដោយចេញមូលបត្របំណុល (bonds) ឬភាគហ៊ុន (equity, IPO)។ ធនាគាររកកម្រៃ ខណៈពេលដែលទទួលហានិភ័យតារាងតុល្យការតិចតួច។","lens":"កម្រៃទីផ្សារមូលធនត្រូវបានស្រឡាញ់៖ រឹមខ្ពស់ ស៊ីដើមទុនតិច (capital-light) និងតាមវដ្ត (cyclical)។"},"83":{"concept":"ការធ្វើមូលបត្រូបនីយកម្ម (Securitization)","explain":"ការប្រមូលកម្ចី — កម្ចីទិញផ្ទះ កាត កម្ចីរថយន្ត — ហើយលក់ជាមូលបត្រអាចជួញដូរបាន ដោយផ្ទេរហានិភ័យចេញពីតារាងតុល្យការ ហើយរំដោះដើមទុនឱ្យខ្ចីម្តងទៀត។ បើប្រើខុស វានឹងជំរុញវិបត្តិឆ្នាំ 2008។","lens":"ឧបករណ៍ដើមទុនដ៏មានឥទ្ធិពល ដែលក្លាយជាអាវុធ ពេលគុណភាពមូលដ្ឋានត្រូវបានលាក់។"},"84":{"concept":"ការគ្រប់គ្រងទ្រព្យស្តុក និងទ្រព្យសកម្ម","explain":"ការគ្រប់គ្រងប្រាក់សម្រាប់បុគ្គល (wealth) និងស្ថាប័ន (asset management) ដើម្បីទទួលកម្រៃដដែលៗ។ ស៊ីដើមទុនតិច ស្អិត (sticky) និងអាចពង្រីកបាន (scalable) — ជាផ្នែកដែលធនាគារចង់បានបំផុត។","lens":"កម្រៃផ្អែកលើ AUM គឺជាប្រាក់ចំណូលឆ្នាំៗ (annuity) ដែល CEO ធនាគារគ្រប់រូបចង់បានបន្ថែម។"},"85":{"concept":"ហិរញ្ញប្បទានពាណិជ្ជកម្ម (Trade finance)","explain":"ការផ្តល់ហិរញ្ញប្បទាន និងកាត់បន្ថយហានិភ័យពាណិជ្ជកម្មសកល — លិខិតឥណទាន (letters of credit) ការធានា ហិរញ្ញប្បទានខ្សែសង្វាក់ផ្គត់ផ្គង់ — ដើម្បីឱ្យអ្នកនាំចេញ និងអ្នកនាំចូល អាចទុកចិត្តគ្នា។ ចាស់ ចាំបាច់ និងសម្បូរកម្រៃ។","lens":"Trade finance ធ្វើឱ្យពាណិជ្ជកម្មសកលរលូន ហើយចងអតិថិជនជាមួយអាជីវកម្មស្អិត និងខាតបង់ទាប។"},"86":{"concept":"សេវារតនាគារ និង FX","explain":"ការជួយអតិថិជនគ្រប់គ្រងរូបិយប័ណ្ណ អត្រា និងសន្ទនីយភាព — ការប្តូរ FX ការការពារហានិភ័យ (hedging) ការគ្រប់គ្រងសាច់ប្រាក់។ វាជាចំណូលបរិមាណច្រើន ដដែលៗ និងចងទំនាក់ទំនង (relationship-anchoring)។","lens":"សេវាទាំងនេះជ្រៅទំនាក់ទំនងអតិថិជន និងបញ្ចេញកម្រៃ ស្ថិរ និងហានិភ័យទាប។"},"87":{"concept":"មូលដ្ឋានឧបករណ៍និស្សន្ទ (Derivatives)","explain":"កិច្ចសន្យាដែលតម្លៃរបស់វា កើតចេញ (derive) ពីទ្រព្យមូលដ្ឋាន — អត្រា FX ទំនិញ សមធម៌។ Forwards ចាក់សោតម្លៃ options ផ្តល់សិទ្ធិ swaps ប្តូរលំហូរសាច់ប្រាក់។ ជាឧបករណ៍ដើម្បីការពារហានិភ័យ ឬដើម្បីធ្វើការប៉ាន់ស្មាន (speculate)។","lens":"ឧបករណ៍និស្សន្ទផ្ទេរហានិភ័យ — គ្រោះថ្នាក់គឺមិនដឹងថាអ្នកណាកាន់វាចុងក្រោយ។"},"88":{"concept":"ការជួញដូរ និងការធ្វើទីផ្សារ (Market-making)","explain":"ធនាគារដាក់តម្លៃទិញ និងលក់ ដោយរកកម្រៃ bid-ask spread និងផ្តល់សន្ទនីយភាព។ វាមានចំណេញ ប៉ុន្តែប្រែប្រួល និងស៊ីដើមទុនច្រើន ច្បាប់ក្រោយឆ្នាំ 2008 កម្រិតការទទួលហានិភ័យផ្ទាល់ខ្លួន (proprietary)។","lens":"ចំណូលពីការជួញដូរតុបតែងឆ្នាំល្អៗ ហើយអាចផ្ទុះឆ្នាំអាក្រក់ៗ។"},"89":{"concept":"ធនាគារសកល ធៀបនឹង ធនាគារឯកទេស","explain":"ធនាគារសកល (universal) គ្របដណ្តប់ លក់រាយ សាជីវកម្ម វិនិយោគ និងទីផ្សារ ធនាគារឯកទេស (specialist) ផ្តោត — អ្នកចេញកាត ធនាគារឯកជន។ ទំហំទូលាយធ្វើពិពិធកម្មចំណូល ប៉ុន្តែបន្ថែមភាពស្មុគស្មាញ និងហានិភ័យប្រព័ន្ធ។","lens":"ពិពិធកម្ម ធៀបនឹង ការផ្តោត គឺជាការជជែកយុទ្ធសាស្ត្រ និងការវាយតម្លៃ ដ៏អចិន្ត្រៃយ៍។"},"90":{"concept":"ពិពិធកម្មចំណូលកម្រៃ","explain":"ការបែងចែកចំណូល ឆ្លងកាត់ការឱ្យខ្ចី និងខ្សែកម្រៃច្រើន ដើម្បីឱ្យចំណេញអាចរស់រានពីការប៉ះទង្គិច លៃក្នុងមួយអតិថិជន = តម្លៃពេញមួយជីវិត (lifetime value: ផលិតផល × រឹម × រយៈពេលនៅជាមួយ) ដកនឹងចំណាយទិញ (acquisition cost)។ ការលក់បន្ថែម (cross-sell) និងការរក្សា (retention) មិនត្រឹមតែការទិញ ជំរុញចំណេញពិតប្រាកដ។","lens":"សង្គ្រាមឈ្នះលើ cross-sell និង retention មិនមែនលើលេខទិញអតិថិជនដ៏ភ្លឺថ្លាទេ។"},"97":{"concept":"ហានិភ័យបទប្បញ្ញត្តិ និងកេរ្តិ៍ឈ្មោះ","explain":"លើសពីហានិភ័យហិរញ្ញវត្ថុ ការពិន័យ ការបាត់អាជ្ញាបណ្ណ និងការខូចខាតកេរ្តិ៍ឈ្មោះ អាចធំជាងការខាតកម្ចីតែមួយឆ្ងាយ។ ក្នុងអាជីវកម្មនៃការទុកចិត្ត កេរ្តិ៍ឈ្មោះគឺជាដើមទុន — ហើយវាបង្គរទៅទាំងពីរទិស។","lens":"ក្នុងវិស័យធនាគារ ការទុកចិត្តគឺជាតារាងតុល្យការ ដែលអ្នកមិនអាចកសាងឡើងវិញមួយយប់បានទេ។"},"98":{"concept":"ដើមទុនជាធនធានកម្រ","explain":"ដើមទុនកំណត់ថាធនាគារអាចឱ្យខ្ចី និងលូតលាស់បានប៉ុន្មាន ដូច្នេះការបែងចែកវាទៅចំណេញថ្លឹងតាមហានិភ័យខ្ពស់បំផុត គឺជាសកម្មភាពយុទ្ធសាស្ត្រស្នូល។ រាល់អាជីវកម្មប្រកួតប្រជែងសម្រាប់ដើមទុនកម្រតែមួយ។","lens":"ការងារពិតរបស់ CEO គឺការសម្រេចថា ដើមទុនឯកតានីមួយៗ រកបានច្រើនបំផុតនៅកន្លែងណា។"},"99":{"concept":"ការដោះដូរ ការលូតលាស់ / ហានិភ័យ / ចំណេញ","explain":"អ្នកអាចដេញតាមការលូតលាស់ សុវត្ថិភាព ឬចំណេញ — កម្រនឹងទាំងបីក្នុងពេលតែមួយ។ ការលូតលាស់លឿន ជាញឹកញាប់មានន័យថាបន្ធូរឥណទាន ចំណេញខ្ពស់ ជាញឹកញាប់មានន័យថាហានិភ័យច្រើន។ ការគ្រប់គ្រងភាពតានតឹងនោះ គឺជាយុទ្ធសាស្ត្រ។","lens":"ចូរប្រយ័ត្នចំពោះធនាគារដែលលូតលាស់លឿនបំផុត — ជាធម្មតាមាននរណាម្នាក់កំពុងកំណត់តម្លៃហានិភ័យទាបពេក ដើម្បីធ្វើវា។"},"100":{"concept":"តារាងពិន្ទុ CEO","explain":"មាត្រដ្ឋានដែលពិតជាវិនិច្ឆ័យ CEO ធនាគារ៖ ROE ធៀបនឹង COE, ដើមទុន CET1, cost-to-income, NIM, គុណភាពទ្រព្យសកម្ម និងចំណេញសរុបរបស់ម្ចាស់ភាគហ៊ុន (total shareholder return) — ទាំងអស់ថ្លឹងធៀបនឹងហានិភ័យ។ អ្វីៗទាំងអស់ឡើងទៅដល់ចំណុចទាំងនេះ។","lens":"ដំណើរការធនាគារតាមលេខទាំងនេះ ហើយតម្លៃភាគហ៊ុននឹងតាមមក ដេញតាមតែតម្លៃភាគហ៊ុនតែឯង នោះពួកវានឹងក្បត់អ្នក។"}}}};

  const LANGS = ["en", "ru", "km"];
  let lang = "en";
  try { const l = localStorage.getItem("ledger.lang"); if (l && LANGS.includes(l)) lang = l; } catch (e) {}

  const uiText = (k) => (lang !== "en" && I18N[lang] && I18N[lang].ui && I18N[lang].ui[k]) || UI_EN[k];
  const modLabel = (cat) => (lang !== "en" && I18N[lang] && I18N[lang].modules && I18N[lang].modules[cat]) || cat;
  const tr = (c) => {
    if (lang !== "en" && I18N[lang] && I18N[lang].cards && I18N[lang].cards[c.n]) {
      const t = I18N[lang].cards[c.n];
      return { concept: t.concept || c.concept, explain: t.explain || c.explain, lens: t.lens || c.lens };
    }
    return { concept: c.concept, explain: c.explain, lens: c.lens };
  };
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  /* ===================== STATE ===================== */
  const $ = (id) => document.getElementById(id);
  const cardEl = $("card");
  const innerEl = cardEl.querySelector(".card-inner");

  let activeCat = "All";
  let order = CARDS.map((c) => c.n);   // list of card numbers in current sequence
  let pos = 0;
  let flipped = false;
  const mastered = new Set();

  // restore mastered set if storage available
  try {
    const saved = JSON.parse(localStorage.getItem("ledger.mastered") || "[]");
    if (Array.isArray(saved)) saved.forEach((n) => mastered.add(n));
  } catch (e) { /* storage blocked — session only */ }

  const persist = () => {
    try { localStorage.setItem("ledger.mastered", JSON.stringify([...mastered])); }
    catch (e) { /* ignore */ }
  };

  const pad = (n) => String(n).padStart(3, "0");
  const currentCard = () => CARDS[order[pos] - 1];

  /* ===================== FILTERS ===================== */
  const cats = ["All", ...CARDS.reduce((a, c) => (a.includes(c.cat) ? a : a.concat(c.cat)), [])];
  const filtersEl = $("filters");
  cats.forEach((cat) => {
    const b = document.createElement("button");
    b.className = "chip";
    b.dataset.cat = cat;

    const lbl = document.createElement("span");
    lbl.className = "c-lbl";
    lbl.textContent = cat === "All" ? uiText("all") : modLabel(cat);
    const num = document.createElement("span");
    num.className = "c-num";
    num.textContent = count;
    b.append(lbl, num);
    b.addEventListener("click", () => setCategory(cat));
    filtersEl.appendChild(b);
  });

  function setCategory(cat) {
    activeCat = cat;
    [...filtersEl.children].forEach((ch, i) =>
      ch.setAttribute("aria-pressed", cats[i] === cat ? "true" : "false")
    );
    order = (cat === "All" ? CARDS : CARDS.filter((c) => c.cat === cat)).map((c) => c.n);
    pos = 0;
    flipped = false;
    render(true);
  }

  /* ===================== RENDER ===================== */
  function render(animate) {
    const c = currentCard();

    // flip state
    cardEl.classList.toggle("flipped", flipped);

    const t = tr(c);
    const catLbl = modLabel(c.cat);

    // front
    $("f-serial").textContent = pad(c.n);
    $("f-cat").textContent = catLbl;
    $("f-kicker").textContent = catLbl;
    $("f-bign").textContent = String(c.n).padStart(2, "0");
    $("f-concept").textContent = t.concept;

    // back
    $("b-serial").textContent = pad(c.n);
    $("b-cat").textContent = catLbl;
    $("b-title").textContent = t.concept;
    $("b-explain").textContent = t.explain;
    $("b-lens").textContent = t.lens;

    // mastered
    const isMastered = mastered.has(c.n);
    cardEl.classList.toggle("known", isMastered);
    const markBtn = $("mark");
    markBtn.setAttribute("aria-pressed", isMastered ? "true" : "false");

    // stats
    $("pos").textContent = pos + 1;
    $("deck-total").textContent = order.length;
    $("known-count").textContent = mastered.size;
    $("progress-bar").style.width = (order.length ? ((pos + 1) / order.length) * 100 : 0) + "%";

    if (animate) {
      cardEl.style.animation = "none";
      // force reflow to restart the enter animation
      void cardEl.offsetWidth;
      cardEl.style.animation = "";
    }
  }

  /* ===================== ACTIONS ===================== */
  function flip() { flipped = !flipped; cardEl.classList.toggle("flipped", flipped); }

  function go(delta) {
    const len = order.length;
    pos = (pos + delta + len) % len;
    flipped = false;
    render(true);
  }

  function toggleMaster() {

    if (mastered.has(c.n)) mastered.delete(c.n);
    else mastered.add(c.n);
    persist();
    render(false);
  }

  // deterministic-enough shuffle without Math.random dependency issues (Fisher–Yates w/ seeded LCG)
  let seed = 0x2545f491;
  function rnd() { seed = (seed * 1103515245 + 12345) & 0x7fffffff; return seed / 0x7fffffff; }
  function shuffle() {
    seed = (seed ^ (order.length * 2654435761 + pos * 40503 + Date.parse("2020-01-01"))) & 0x7fffffff;
    for (let i = order.length - 1; i > 0; i--) {
      const j = Math.floor(rnd() * (i + 1));
      [order[i], order[j]] = [order[j], order[i]];
    }
    pos = 0;
    flipped = false;
    render(true);
  }

  $("prev").addEventListener("click", () => go(-1));
  $("next").addEventListener("click", () => go(1));
  $("flip").addEventListener("click", flip);

  cardEl.addEventListener("click", flip);
  cardEl.addEventListener("keydown", (e) => {

  /* ===================== LANGUAGE ===================== */
  function applyLang(l) {

    const root = document.documentElement;

    root.setAttribute("lang", lang);

      b.setAttribute("aria-pressed", b.dataset.lang === lang ? "true" : "false"));

    // tagline (two parts + separator)
    const tg = $("tagline");
    tg.textContent = "";
    tg.append(document.createTextNode(uiText("tagline1")));
    const rule = document.createElement("span");
    rule.className = "rule"; rule.textContent = "/";
    tg.append(rule, document.createTextNode(uiText("tagline2")));

    // static labels
    $("lbl-card").textContent = uiText("cardLabel");
    $("lbl-known").textContent = uiText("masteredLabel");
    $("flip-hint-txt").textContent = uiText("reveal");
    $("known-flag-txt").textContent = uiText("masteredFlag");
    $("lens-lbl").textContent = uiText("lensLabel");
    $("txt-flip").textContent = uiText("flip");
    $("txt-master").textContent = uiText("master");
    $("txt-shuffle").textContent = uiText("shuffle");

    // aria labels
    cardEl.setAttribute("aria-label", uiText("cardAria"));
    $("prev").setAttribute("aria-label", uiText("prevAria"));
    $("next").setAttribute("aria-label", uiText("nextAria"));
    $("flip").setAttribute("aria-label", uiText("flipAria"));
    $("mark").setAttribute("aria-label", uiText("markAria"));
    $("shuffle").setAttribute("aria-label", uiText("shuffleAria"));

    // keyboard help
    $("kbd-help").innerHTML =
      "<kbd>&larr;</kbd> <kbd>&rarr;</kbd> " + esc(uiText("kbNav")) +
      " &middot; <kbd>Space</kbd> " + esc(uiText("kbFlip")) +
      " &middot; <kbd>K</kbd> " + esc(uiText("kbMaster")) +
      " &middot; <kbd>S</kbd> " + esc(uiText("kbShuffle"));

    // chip labels
    [...filtersEl.children].forEach((ch) => {
      const cat = ch.dataset.cat;
      const lbl = ch.querySelector(".c-lbl");
      if (lbl) lbl.textContent = cat === "All" ? uiText("all") : modLabel(cat);
    });

    render(false);
  }

  [...document.querySelectorAll("#lang-switch .lang")].forEach((b) =>
    b.addEventListener("click", () => applyLang(b.dataset.lang)));

  document.addEventListener("keydown", (e) => {
    if (e.target.classList && e.target.classList.contains("chip")) return;
    switch (e.key) {
      case "ArrowLeft":  e.preventDefault(); go(-1); break;
      case "ArrowRight": e.preventDefault(); go(1); break;
      case " ":
        if (e.target === cardEl) return; // handled above
        e.preventDefault(); flip(); break;
      case "k": case "K": toggleMaster(); break;
      case "s": case "S": shuffle(); break;
    }
  });

  /* ===================== GUILLOCHÉ ENGRAVING ===================== */
  const canvas = $("guilloche");
  const ctx = canvas.getContext("2d");
  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  let phase = 0, W = 0, H = 0, dpr = 1;

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    const r = canvas.getBoundingClientRect();
    W = r.width; H = r.height;
    canvas.width = W * dpr; canvas.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function inkColor(alpha) {
    const c = getComputedStyle(document.documentElement).getPropertyValue("--guilloche").trim() || "24,90,72";
    return "rgba(" + c + "," + alpha + ")";
  }

  // draw a hypotrochoid rosette — the classic banknote guilloché
  function rosette(cx, cy, R, r, d, turns, ink) {
    ctx.beginPath();
    const steps = 900;
    const k = (R - r) / r;
    for (let i = 0; i <= steps; i++) {
      const t = (i / steps) * Math.PI * 2 * turns;
      const x = cx + (R - r) * Math.cos(t) + d * Math.cos(k * t + phase);
      const y = cy + (R - r) * Math.sin(t) - d * Math.sin(k * t + phase);
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.strokeStyle = ink;
    ctx.lineWidth = 0.6;
    ctx.stroke();
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    const cx = W / 2, cy = H / 2;
    const base = Math.min(W, H);
    const R = base * 0.42;
    // layered rosettes for a woven engraving feel
    rosette(cx, cy, R, R * 0.28, R * 0.34, 7, inkColor(0.16));
    rosette(cx, cy, R * 0.82, R * 0.22, R * 0.30, 9, inkColor(0.12));
    rosette(cx, cy, R * 0.62, R * 0.18, R * 0.24, 11, inkColor(0.10));
    // faint concentric guides
    ctx.strokeStyle = inkColor(0.06);
    ctx.lineWidth = 0.5;
    for (let i = 1; i <= 3; i++) {
      ctx.beginPath();
      ctx.arc(cx, cy, R * (0.5 + i * 0.16), 0, Math.PI * 2);
      ctx.stroke();
    }
  }

  function loop() {
    phase += 0.0016;
    draw();
    requestAnimationFrame(loop);
  }

  window.addEventListener("resize", () => { resize(); draw(); });

  /* ===================== INIT ===================== */
  resize();
  applyLang(lang);
  if (reduce) draw(); else loop();

  // redraw guilloché when the viewer flips theme (data-theme mutation)
  new MutationObserver(() => { if (reduce) draw(); })
    .observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
})();
</script>
</body>
</html>
